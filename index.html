<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Guided Session Recorder</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>⏱</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="wrap">
  <div class="mast">
    <h1 id="mTitle"></h1>
    <span class="sub" id="mSub"></span>
    <span class="spacer"></span>
    <span class="who" id="who"></span>
    <button class="lang" type="button" id="langBtn"></button>
  </div>
  <nav class="rail" id="rail"></nav>
  <div id="panel"></div>
</div>

<div class="bar"><div class="inner" id="bar"></div></div>

<script src="vendor/i18next.min.js"></script>
<script src="locales/en.js"></script>
<script src="locales/zh.js"></script>
<script>
(function () {
  "use strict";

  var KEY = "usability_recorder_v1";
  var LANG_KEY = "usability_recorder_lang";
  // One cap per task rather than one for all five. T2 has a learner read a full
  // passage and answer it, which no honest protocol squeezes into five minutes.
  var CAPS = { T1: 300, T2: 600, T3: 300, T4: 300, T5: 360, T6: 360, T7: 480 };
  // Tasks that make the learner wait on a model call. Waiting is the model's
  // time, not the interface's, so it is banked separately and ignored by the cap.
  var AI_WAIT = { T2: true, T5: true, T6: true, T7: true };
  var IDS = ["T1", "T2", "T3", "T4", "T5", "T6", "T7"];
  function capOf(i) { return CAPS[IDS[i]]; }
  var WRAP = IDS.length + 1, TOTALS = IDS.length + 2;
  var DEBRIEF_KEYS = ["stuck", "useful", "change"];

  // ---------- i18n ----------
  function initialLang() {
    try {
      var stored = localStorage.getItem(LANG_KEY);
      if (stored === "en" || stored === "zh") return stored;
    } catch (e) {}
    return (navigator.language || "en").toLowerCase().indexOf("zh") === 0 ? "zh" : "en";
  }

  i18next.init({
    lng: initialLang(),
    fallbackLng: "en",
    ns: ["ui", "script", "task"],
    defaultNS: "ui",
    resources: { en: window.__RES.en, zh: window.__RES.zh },
    interpolation: { escapeValue: false }
  });

  function t(k, o) { return i18next.t(k, o); }
  // Exports follow the interface language: one language per rendering, never mixed.

  function setLang(code) {
    i18next.changeLanguage(code, function () {
      try { localStorage.setItem(LANG_KEY, code); } catch (e) {}
      document.documentElement.setAttribute("lang", code === "zh" ? "zh-CN" : "en");
      render();
    });
  }

  // ---------- state ----------
  var step = 0, s = blank(), tick = null, savedTimer = null;

  function today() {
    var d = new Date(), p = function (n) { return (n < 10 ? "0" : "") + n; };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }
  function blank() {
    return {
      name: "", date: today(),
      tasks: IDS.map(function () { return { secs:0, running:false, startedAt:0, wait:0, waiting:false, waitStartedAt:0, wrong:0, hint:null, quote:"" }; }),
      debrief: { stuck:"", useful:"", change:"" }
    };
  }
  function store() { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { return {}; } }
  function save() {
    if (!s.name) return;
    var all = store(); all[s.name] = s;
    try { localStorage.setItem(KEY, JSON.stringify(all)); } catch (e) {}
    var el = document.getElementById("savedFlag");
    if (!el) return;
    el.setAttribute("data-on", "1");
    clearTimeout(savedTimer);
    savedTimer = setTimeout(function () { el.setAttribute("data-on", "0"); }, 1200);
  }

  function liveSecs(x) { return x.running ? x.secs + Math.floor((Date.now() - x.startedAt) / 1000) : x.secs; }
  function liveWait(x) { return x.waiting ? (x.wait || 0) + Math.floor((Date.now() - x.waitStartedAt) / 1000) : (x.wait || 0); }
  function bank(x) {
    if (x.running) { x.secs = liveSecs(x); x.running = false; }
    if (x.waiting) { x.wait = liveWait(x); x.waiting = false; }
  }
  function outcome(x, i) {
    if (liveSecs(x) >= capOf(i === undefined ? s.tasks.indexOf(x) : i)) return { key:"failed", en:"failed (timeout)", k:"bad",  label:t("outFailTimeout") };
    if (x.hint === 3)         return { key:"failed", en:"failed (demonstrated)", k:"bad", label:t("outFailDemo") };
    if (x.hint === 1 || x.hint === 2) return { key:"hint", en:"with hint", k:"warn", label:t("outWithHint") };
    if (x.hint === 0)         return { key:"independent", en:"independent", k:"ok", label:t("outIndependent") };
    return { key:"none", en:"not recorded", k:"none", label:t("outNotRecorded") };
  }
  function mmss(sec) { var m = Math.floor(sec/60), r = sec%60; return m + ":" + (r<10?"0":"") + r; }
  function done(i) { var x = s.tasks[i]; return x.hint !== null || liveSecs(x) >= capOf(i); }
  function esc(x) { return String(x).replace(/[&<>"]/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];}); }
  function median(a) {
    if (!a.length) return null;
    var b = a.slice().sort(function (p, q) { return p - q; }), m = Math.floor(b.length / 2);
    return b.length % 2 ? b[m] : Math.round((b[m-1] + b[m]) / 2);
  }

  // ---------- timer ----------
  function startLoop() {
    if (tick) return;
    tick = setInterval(function () {
      var x = s.tasks[step-1];
      if (!x || (!x.running && !x.waiting)) return;
      paintClock();
      var el = document.getElementById("over");
      if (el) el.setAttribute("data-on", liveSecs(x) >= capOf(step-1) ? "1" : "0");
    }, 250);
  }
  function stopLoop() { clearInterval(tick); tick = null; }
  function paintClock() {
    var c = document.getElementById("clock"); if (!c) return;
    var x = s.tasks[step-1]; if (!x) return;
    var sec = liveSecs(x);
    c.firstChild.nodeValue = mmss(sec);
    c.setAttribute("data-run", x.running ? "1" : "0");
    c.setAttribute("data-wait", x.waiting ? "1" : "0");
    c.setAttribute("data-over", sec >= capOf(step-1) ? "1" : "0");
    var w = document.getElementById("waitClock");
    if (w) w.textContent = t("waitShort") + " " + mmss(liveWait(x));
  }

  function bindText(id, fn) {
    var el = document.getElementById(id); if (!el) return;
    el.oninput = function () { fn(el.value); };
  }
  function mkBtn(label, cls, fn) {
    var b = document.createElement("button");
    b.type = "button"; b.className = cls; b.textContent = label; b.onclick = fn;
    return b;
  }
  function copyFrom(id, btn, okLabel, backLabel) {
    var o = document.getElementById(id);
    o.style.display = "block";
    o.select(); o.setSelectionRange(0, 999999);
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    btn.textContent = ok ? okLabel : t("copyManually");
    setTimeout(function () { btn.textContent = backLabel; }, 1700);
  }

  // ---------- render ----------
  function render() {
    document.getElementById("mTitle").textContent = t("appTitle");
    document.getElementById("mSub").textContent = t("appSub");
    document.getElementById("who").textContent = s.name ? (s.name + " · " + s.date) : "";
    var lb = document.getElementById("langBtn");
    lb.textContent = t("langSwitch");
    lb.onclick = function () { setLang(i18next.language === "en" ? "zh" : "en"); };
    renderRail();
    if (step === 0) renderSetup();
    else if (step === WRAP) renderWrap();
    else if (step === TOTALS) renderTotals();
    else renderTask(step - 1);
    renderBar();
  }

  function renderRail() {
    var rail = document.getElementById("rail");
    var labels = [t("stepSetup")].concat(IDS).concat([t("stepWrap"), t("stepAnalysis")]);
    rail.innerHTML = "";
    labels.forEach(function (lab, i) {
      var b = document.createElement("button");
      b.type = "button"; b.textContent = lab;
      if (i === step) b.setAttribute("aria-current", "true");
      else if (i >= 1 && i <= IDS.length && done(i-1)) b.setAttribute("data-state", "done");
      b.onclick = function () { go(i); };
      rail.appendChild(b);
    });
  }

  function renderSetup() {
    var all = store(), names = Object.keys(all).sort();
    var rows = names.map(function (n) {
      var r = all[n];
      var c = r.tasks.filter(function (x) { return x.hint !== null; }).length;
      return '<div class="sess"><span class="pid">' + esc(n) + '</span><span>' + esc(r.date) +
             '</span><span class="prog">' + c + '/' + IDS.length + '</span>' +
             '<button type="button" data-load="' + esc(n) + '">' + t("load") + '</button>' +
             '<button type="button" data-del="' + esc(n) + '">' + t("del") + '</button></div>';
    }).join("");

    document.getElementById("panel").innerHTML =
      '<div class="card">' +
        '<p class="eyebrow"><span class="tag">' + t("setupTag") + '</span> ' + t("setupEyebrow") +
          '<span class="saved" id="savedFlag" data-on="0">' + t("saved") + '</span></p>' +
        '<h2>' + t("setupHeading") + '</h2>' +
        '<p class="meta">' + t("setupNote") + '</p>' +
        '<input type="text" id="f_name" placeholder="' + esc(t("namePlaceholder")) + '" autocomplete="off" value="' + esc(s.name) + '">' +
        '<div class="field"><p class="flabel">' + t("beforeYouStart") + '</p><ol class="ol">' +
          '<li>' + t("prep1") + '</li><li>' + t("prep2") + '</li><li>' + t("prep3") + '</li>' +
          '<li>' + t("prep4") + '</li><li>' + t("prep5") + '</li></ol></div>' +
      '</div>' +

      '<div class="card">' +
        '<p class="eyebrow"><span class="tag">' + t("readAloudTag") + '</span> ' + t("sameWords") + '</p>' +
        '<div class="script"><span class="lab">' + t("openingLabel") + '</span>' +
          '<p class="small">' + t("script:opening") + '</p>' +
        '</div>' +
      '</div>' +

      (names.length
        ? '<div class="card"><p class="eyebrow"><span class="tag">' + t("thisDevice") + '</span> ' +
          t("sessionsSaved", { count: names.length }) + '</p>' +
          '<div class="sessions">' + rows + '</div>' +
          '<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">' +
            '<button class="btn ghost" type="button" id="dumpAll">' + t("exportAll", { count: names.length }) + '</button>' +
            '<button class="btn ghost" type="button" id="toTotals">' + t("btnSeeTotals") + '</button>' +
          '</div>' +
          '<textarea class="out" id="allOut" readonly style="display:none;margin-top:12px"></textarea>' +
          '<p class="note">' + t("storageNote") + '</p></div>'
        : '') +
      '<p style="text-align:center;margin:18px 0 0"><a href="admin.html" style="font-family:var(--f-num);font-size:12px;letter-spacing:.06em;color:var(--ink-3)">' + t("adminLink") + '</a></p>';

    bindText("f_name", function (v) { s.name = v.trim(); save(); document.getElementById("who").textContent = s.name ? (s.name + " · " + s.date) : ""; renderBar(); });

    Array.prototype.forEach.call(document.querySelectorAll("[data-load]"), function (b) {
      b.onclick = function () { var r = store()[b.getAttribute("data-load")]; if (r) { s = r; step = 0; render(); } };
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-del]"), function (b) {
      b.onclick = function () {
        var n = b.getAttribute("data-del"), all2 = store();
        delete all2[n];
        try { localStorage.setItem(KEY, JSON.stringify(all2)); } catch (e) {}
        if (s.name === n) s = blank();
        render();
      };
    });
    var dump = document.getElementById("dumpAll");
    if (dump) dump.onclick = function () {
      var all2 = store(), ta = document.getElementById("allOut");
      ta.value = Object.keys(all2).sort().map(function (n) { return recordOf(all2[n]); }).join("\n\n---\n\n");
      copyFrom("allOut", dump, t("allCopied"), t("exportAll", { count: Object.keys(all2).length }));
    };
    var tot = document.getElementById("toTotals");
    if (tot) tot.onclick = function () { go(7); };
  }

  function renderTask(i) {
    var id = IDS[i], x = s.tasks[i], o = outcome(x, i);
    var caps = [t("task:hintNone"), t("task:hintDirection"), t("task:hintLocation"), t("task:hintDemo")];
    var segs = caps.map(function (cap, k) {
      return '<button type="button" data-hint="' + k + '" aria-pressed="' + (x.hint === k) + '">' +
             '<span class="lv">L' + k + '</span><span class="cap">' + cap + '</span></button>';
    }).join("");
    var flag = t("task:" + id + "_flag");

    document.getElementById("panel").innerHTML =
      '<div class="card">' +
        '<p class="eyebrow"><span class="tag">' + id + '</span> ' + t("taskOf", { n: i + 1, total: IDS.length }) +
          '<span class="saved" id="savedFlag" data-on="0">' + t("saved") + '</span></p>' +
        '<h2>' + esc(t("task:" + id + "_name")) + '</h2>' +
        '<div class="script"><span class="lab">' + t("readToParticipant") + '</span>' +
          '<p>' + esc(t("script:" + id)) + '</p>' +
        '</div>' +
        '<div class="crit">' +
          '<div><b>' + t("success") + '</b><span>' + esc(t("task:" + id + "_pass")) + '</span></div>' +
          '<div><b>' + t("covers") + '</b><span>' + esc(t("task:" + id + "_covers")) + '</span></div>' +
          (flag ? '<div><b>' + t("watchFor") + '</b><span class="flag">' + esc(flag) + '</span></div>' : '') +
        '</div>' +
        '<div class="field">' +
          '<p class="flabel">' + t("wrongTurns") + ' <span class="hint">' + t("wrongTurnsHint") + '</span></p>' +
          '<div class="tally">' +
            '<button class="knob" type="button" id="w_dn"' + (x.wrong === 0 ? " disabled" : "") + '>&minus;</button>' +
            '<span class="num">' + x.wrong + '</span>' +
            '<button class="knob" type="button" id="w_up">+</button>' +
          '</div>' +
        '</div>' +
        '<div class="field">' +
          '<p class="flabel">' + t("hintLevel") + ' <span class="hint">' + t("hintLevelHint") + '</span></p>' +
          '<div class="seg" id="seg">' + segs + '</div>' +
          '<div class="ladder">L1 <code>' + esc(t("script:L1")) + '</code><br>' +
            'L2 <code>' + esc(t("script:L2")) + '</code> ' + t("ladderNote") + '<br>' +
            t("ladderDemo") + '</div>' +
          '<div style="margin-top:14px"><span class="chip ' + o.k + '">' + o.label + '</span></div>' +
          '<div class="over" id="over" data-on="' + (liveSecs(x) >= capOf(i) ? "1" : "0") + '">' + t("timeoutBanner", { cap: mmss(capOf(i)) }) + '</div>' +
        '</div>' +
        '<div class="field">' +
          '<p class="flabel">' + t("verbatim") + ' <span class="hint">' + t("verbatimHint") + '</span></p>' +
          '<textarea id="q" rows="3" placeholder="' + esc(t("verbatimPlaceholder")) + '">' + esc(x.quote) + '</textarea>' +
        '</div>' +
      '</div>';

    document.getElementById("w_up").onclick = function () { x.wrong++; save(); renderTask(i); };
    document.getElementById("w_dn").onclick = function () { if (x.wrong > 0) x.wrong--; save(); renderTask(i); };
    Array.prototype.forEach.call(document.querySelectorAll("#seg button"), function (b) {
      b.onclick = function () {
        var k = parseInt(b.getAttribute("data-hint"), 10);
        x.hint = (x.hint === k) ? null : k;
        save(); renderTask(i); renderRail();
      };
    });
    bindText("q", function (v) { x.quote = v; save(); });
    paintClock();
  }

  function renderWrap() {
    var fields = DEBRIEF_KEYS.map(function (k) {
      return '<div class="field"><p class="flabel">' + t("task:debrief_" + k) + '</p>' +
             '<textarea id="d_' + k + '" rows="2" placeholder="' + esc(t("debriefPlaceholder")) + '">' + esc(s.debrief[k]) + '</textarea></div>';
    }).join("");

    document.getElementById("panel").innerHTML =
      '<div class="card">' +
        '<p class="eyebrow"><span class="tag">' + t("wrapTag") + '</span> ' + t("wrapEyebrow") +
          '<span class="saved" id="savedFlag" data-on="0">' + t("saved") + '</span></p>' +
        '<h2>' + t("wrapHeading") + '</h2>' +
        '<p class="meta">' + t("wrapNote") + '</p>' + fields +
      '</div>' +
      '<div class="card">' +
        '<p class="eyebrow"><span class="tag">' + t("exportTag") + '</span> ' + t("exportEyebrow") + '</p>' +
        '<textarea class="out" id="out" readonly></textarea>' +
        '<p class="note">' + t("exportNote") + '</p>' +
      '</div>';

    DEBRIEF_KEYS.forEach(function (k) { bindText("d_" + k, function (v) { s.debrief[k] = v; save(); paintOut(); }); });
    paintOut();
  }

  // ---------- aggregation ----------
  function aggregate() {
    var all = store(), names = Object.keys(all).sort();
    var rows = IDS.map(function (id, i) {
      var ind = 0, hint = 0, fail = 0, none = 0, times = [], waits = [], wrong = 0, quotes = [];
      names.forEach(function (n) {
        var x = all[n].tasks[i], o = outcome(x, i);
        if (o.key === "independent") ind++;
        else if (o.key === "hint") hint++;
        else if (o.key === "failed") fail++;
        else { none++; return; }
        times.push(liveSecs(x));
        if (AI_WAIT[id]) waits.push(liveWait(x));
        wrong += x.wrong;
        if ((x.quote || "").trim()) quotes.push({ who: n, text: x.quote.trim() });
      });
      return { id: id, ind: ind, hint: hint, fail: fail, none: none,
               med: median(times), medWait: waits.length ? median(waits) : null,
               wrong: wrong, quotes: quotes };
    });
    return { n: names.length, names: names, rows: rows, all: all };
  }

  function renderTotals() {
    var a = aggregate();
    if (!a.n) {
      document.getElementById("panel").innerHTML =
        '<div class="card"><p class="eyebrow"><span class="tag">' + t("analysisTag") + '</span> ' + t("analysisEyebrow") + '</p>' +
        '<h2>' + t("analysisHeading") + '</h2><p class="meta">' + t("analysisEmpty") + '</p></div>';
      return;
    }

    var body = a.rows.map(function (r) {
      return '<tr><td><span class="id">' + r.id + '</span>' + esc(t("task:" + r.id + "_name")) + '</td>' +
        '<td class="' + (r.ind ? "ok" : "zero") + '">' + r.ind + ' / ' + a.n + '</td>' +
        '<td class="' + (r.hint ? "" : "zero") + '">' + r.hint + ' / ' + a.n + '</td>' +
        '<td class="' + (r.fail ? "bad" : "zero") + '">' + r.fail + ' / ' + a.n + '</td>' +
        '<td>' + (r.med === null ? "—" : r.med + " s") + '</td>' +
        '<td class="' + (r.medWait === null ? "zero" : "") + '">' + (r.medWait === null ? "—" : r.medWait + " s") + '</td>' +
        '<td class="' + (r.wrong ? "" : "zero") + '">' + r.wrong + '</td></tr>';
    }).join("");

    var quotes = a.rows.filter(function (r) { return r.quotes.length; }).map(function (r) {
      return '<h3>' + r.id + ' · ' + esc(t("task:" + r.id + "_name")) + '</h3>' +
        r.quotes.map(function (q) {
          return '<p><span class="src">' + esc(q.who) + '</span>' + esc(q.text) + '</p>';
        }).join("");
    }).join("");

    document.getElementById("panel").innerHTML =
      '<div class="card">' +
        '<p class="eyebrow"><span class="tag">' + t("analysisTag") + '</span> ' + t("analysisEyebrow") + ' · n = ' + a.n + '</p>' +
        '<h2>' + t("analysisHeading") + '</h2>' +
        '<div class="tblwrap"><table class="agg"><thead><tr>' +
          '<th>' + t("thTask") + '</th><th>' + t("outIndependent") + '</th><th>' + t("outWithHint") + '</th>' +
          '<th>' + t("thFailed") + '</th><th>' + t("thMedianShort") + '</th><th>' + t("thWait") + '</th><th>' + t("wrongTurns") + '</th>' +
        '</tr></thead><tbody>' + body + '</tbody></table></div>' +
        '<p class="note">' + t("analysisNote") + '</p>' +
      '</div>' +
      (quotes ? '<div class="card"><p class="eyebrow"><span class="tag">' + t("verbatim") + '</span> ' + t("quotesHeading") + '</p><div class="qgroup">' + quotes + '</div></div>' : '') +
      '<div class="card"><p class="eyebrow"><span class="tag">' + t("exportTag") + '</span> Table 7.10</p>' +
        '<textarea class="out" id="aggOut" readonly>' + esc(aggMarkdown(a)) + '</textarea></div>';
  }

  function aggMarkdown(a) {
    var L = [];
    L.push(t("expCap1", { n: a.n }));
    L.push(t("expCap2"));
    L.push("");
    L.push(t("expHead"));
    L.push("|---|:---:|:---:|:---:|---:|---:|---:|");
    a.rows.forEach(function (r) {
      L.push("| " + r.id + " " + t("task:" + r.id + "_name") + " | " +
        r.ind + " of " + a.n + " | " + r.hint + " of " + a.n + " | " + r.fail + " of " + a.n + " | " +
        (r.med === null ? "—" : r.med + " s") + " | " +
        (r.medWait === null ? "—" : r.medWait + " s") + " | " + r.wrong + " |");
    });
    L.push("");
    L.push(t("expCapNote", { caps: IDS.map(function (id, k) { return id + " " + mmss(capOf(k)); }).join(", ") }));
    L.push("");
    L.push(t("expParticipants") + " " + a.names.map(function (n, i) { return "P" + (i + 1) + " = " + n; }).join(", "));
    L.push("");
    L.push(t("expVerbatimH"));
    a.rows.forEach(function (r) {
      if (!r.quotes.length) return;
      L.push("");
      L.push("- **" + r.id + " " + t("task:" + r.id + "_name") + "**");
      r.quotes.forEach(function (q) { L.push("  - " + q.who + ": " + q.text.replace(/\n/g, " ")); });
    });
    L.push("");
    L.push(t("expDebriefH"));
    DEBRIEF_KEYS.forEach(function (k) {
      L.push("");
      L.push("- **" + t("task:debrief_" + k) + "**");
      a.names.forEach(function (n) {
        var v = (a.all[n].debrief[k] || "").replace(/\n/g, " ").trim();
        if (v) L.push("  - " + n + ": " + v);
      });
    });
    return L.join("\n");
  }

  function recordOf(r) {
    var L = [];
    L.push("## " + (r.name || "?") + " · " + r.date);
    L.push("");
    L.push(t("expSessHead"));
    L.push("|---|---|---:|---:|---|---|");
    IDS.forEach(function (id, i) {
      var x = r.tasks[i], o = outcome(x, i);
      L.push("| " + id + " " + t("task:" + id + "_name") + " | " + o.label + " | " + liveSecs(x) + " s | " +
             (AI_WAIT[id] ? liveWait(x) + " s" : "—") + " | " +
             x.wrong + " | " + (x.hint === null ? "—" : "L" + x.hint) + " | " +
             ((x.quote || "").replace(/\n/g, " ").replace(/\|/g, "/") || "—") + " |");
    });
    L.push("");
    L.push(t("expDebriefLabel"));
    DEBRIEF_KEYS.forEach(function (k) {
      L.push("- " + t("task:debrief_" + k) + "  " + ((r.debrief[k] || "").replace(/\n/g, " ") || "—"));
    });
    L.push("");
    L.push("```json");
    L.push(JSON.stringify({
      name: r.name, date: r.date,
      tasks: IDS.map(function (id, i) {
        var x = r.tasks[i];
        return { id:id, secs:liveSecs(x), wait:liveWait(x), wrong:x.wrong, hint:x.hint, outcome:outcome(x, i).en, quote:x.quote };
      }),
      debrief: r.debrief
    }, null, 1));
    L.push("```");
    return L.join("\n");
  }

  function paintOut() {
    var el = document.getElementById("out");
    if (el) el.value = recordOf(s);
  }

  function renderBar() {
    var bar = document.getElementById("bar");
    bar.innerHTML = "";

    if (step === 0) {
      var start = mkBtn(t("btnStartT1"), "btn wide", function () { go(1); });
      if (!s.name) start.disabled = true;
      bar.appendChild(start);
      stopLoop();
      return;
    }
    if (step === WRAP) {
      bar.appendChild(mkBtn(t("btnBack"), "btn ghost", function () { go(IDS.length); }));
      var cb = mkBtn(t("btnCopySession"), "btn wide", function () { copyFrom("out", cb, t("btnCopied"), t("btnCopySession")); });
      bar.appendChild(cb);
      bar.appendChild(mkBtn(t("btnSeeTotals"), "btn ghost", function () { go(7); }));
      stopLoop();
      return;
    }
    if (step === TOTALS) {
      bar.appendChild(mkBtn(t("btnBack"), "btn ghost", function () { go(0); }));
      var tb = mkBtn(t("btnCopyTable"), "btn wide", function () { copyFrom("aggOut", tb, t("btnCopied"), t("btnCopyTable")); });
      if (!document.getElementById("aggOut")) tb.disabled = true;
      bar.appendChild(tb);
      stopLoop();
      return;
    }

    var i = step - 1, x = s.tasks[i], id = IDS[i];
    var clock = document.createElement("span");
    clock.className = "clock"; clock.id = "clock";
    clock.appendChild(document.createTextNode(mmss(liveSecs(x))));
    var u = document.createElement("span"); u.className = "u"; u.textContent = " / " + mmss(capOf(i));
    clock.appendChild(u);
    bar.appendChild(clock);

    if (AI_WAIT[id]) {
      var wc = document.createElement("span");
      wc.className = "waitclock"; wc.id = "waitClock";
      wc.textContent = t("waitShort") + " " + mmss(liveWait(x));
      if (x.waiting) wc.setAttribute("data-on", "1");
      bar.appendChild(wc);
    }

    if (x.waiting) {
      bar.appendChild(mkBtn(t("btnWaitEnd"), "btn run", function () {
        x.wait = liveWait(x); x.waiting = false;
        x.running = true; x.startedAt = Date.now();
        save(); renderBar(); startLoop();
      }));
    } else if (!x.running) {
      bar.appendChild(mkBtn(x.secs === 0 ? t("btnStartTimer") : t("btnResume"), "btn run", function () {
        x.running = true; x.startedAt = Date.now(); save(); renderBar(); startLoop();
      }));
    } else {
      if (AI_WAIT[id]) {
        bar.appendChild(mkBtn(t("btnWaitStart"), "btn wait", function () {
          x.secs = liveSecs(x); x.running = false;
          x.waiting = true; x.waitStartedAt = Date.now();
          save(); renderBar(); startLoop();
        }));
      }
      bar.appendChild(mkBtn(t("btnStop"), "btn", function () {
        bank(x); save(); renderBar(); paintClock();
      }));
    }
    bar.appendChild(mkBtn(step === IDS.length ? t("btnWrapUp") : t("btnNext"), "btn ghost", function () {
      bank(x); save(); go(step + 1);
    }));

    paintClock();
    if (x.running || x.waiting) startLoop(); else stopLoop();
  }

  function go(n) {
    var cur = s.tasks[step-1];
    if (cur) bank(cur);
    step = Math.max(0, Math.min(TOTALS, n));
    save(); render(); window.scrollTo(0, 0);
  }

  window.addEventListener("beforeunload", function () {
    var cur = s.tasks[step-1];
    if (cur && (cur.running || cur.waiting)) { bank(cur); save(); }
  });

  document.documentElement.setAttribute("lang", i18next.language === "zh" ? "zh-CN" : "en");
  render();
})();
</script>
</body>
</html>
