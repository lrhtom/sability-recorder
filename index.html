<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Guided Session Recorder</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>⏱</text></svg>">
<style>
  :root {
    --ground:#E9EBE7; --surface:#FBFBF9; --sunk:#E2E5E0;
    --ink:#14181A; --ink-2:#4A5350; --ink-3:#7C8582; --rule:#CDD2CB;
    --accent:#B33A2B; --ok:#1E6B45; --warn:#8A6212; --bad:#8E2A1E;
    --shadow:0 1px 2px rgba(20,24,26,.06), 0 8px 24px rgba(20,24,26,.05);
    --f-ui:"Helvetica Neue", Arial, "Microsoft YaHei", "PingFang SC", sans-serif;
    --f-num:ui-monospace, "SF Mono", "Cascadia Mono", Consolas, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground:#131719; --surface:#1B2023; --sunk:#23292C;
      --ink:#E8EBE7; --ink-2:#A3ABA7; --ink-3:#6F7A75; --rule:#2E3538;
      --accent:#E06850; --ok:#4FA97A; --warn:#D19A3C; --bad:#D26A56;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"]{--ground:#131719;--surface:#1B2023;--sunk:#23292C;--ink:#E8EBE7;--ink-2:#A3ABA7;--ink-3:#6F7A75;--rule:#2E3538;--accent:#E06850;--ok:#4FA97A;--warn:#D19A3C;--bad:#D26A56;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);}
  :root[data-theme="light"]{--ground:#E9EBE7;--surface:#FBFBF9;--sunk:#E2E5E0;--ink:#14181A;--ink-2:#4A5350;--ink-3:#7C8582;--rule:#CDD2CB;--accent:#B33A2B;--ok:#1E6B45;--warn:#8A6212;--bad:#8E2A1E;--shadow:0 1px 2px rgba(20,24,26,.06),0 8px 24px rgba(20,24,26,.05);}

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ground); color:var(--ink); font-family:var(--f-ui);
    font-size:16px; line-height:1.5; min-height:100vh;
    padding:0 0 max(108px, calc(88px + env(safe-area-inset-bottom)));
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:720px;margin:0 auto;padding:0 16px;}

  .mast{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:20px 0 14px;}
  .mast h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em;}
  .mast .sub{font-family:var(--f-num);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);}
  .mast .who{margin-left:auto;font-family:var(--f-num);font-size:12px;color:var(--ink-2);}

  .rail{display:flex;gap:3px;margin-bottom:18px;}
  .rail button{
    flex:1;appearance:none;border:0;cursor:pointer;background:var(--sunk);color:var(--ink-3);
    font-family:var(--f-num);font-size:11px;letter-spacing:.06em;padding:7px 0 6px;
    border-radius:2px;border-bottom:2px solid transparent;
    transition:color .12s,border-color .12s,background .12s;
  }
  .rail button:hover{color:var(--ink-2);}
  .rail button[data-state="done"]{color:var(--ok);border-bottom-color:var(--ok);}
  .rail button[aria-current="true"]{background:var(--surface);color:var(--ink);border-bottom-color:var(--accent);font-weight:700;}
  .rail button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .card{background:var(--surface);border:1px solid var(--rule);border-radius:4px;box-shadow:var(--shadow);padding:20px;margin-bottom:14px;}
  .eyebrow{font-family:var(--f-num);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px;display:flex;gap:10px;align-items:center;}
  .eyebrow .tag{background:var(--sunk);color:var(--ink-2);padding:2px 7px;border-radius:2px;letter-spacing:.06em;}
  h2{margin:0 0 4px;font-size:21px;font-weight:700;letter-spacing:-.015em;text-wrap:balance;}
  .meta{color:var(--ink-3);font-size:13px;margin:0 0 16px;line-height:1.6;}

  .script{background:var(--sunk);border-left:3px solid var(--accent);border-radius:0 3px 3px 0;padding:16px 18px;margin:0 0 16px;}
  .script .lab{font-family:var(--f-num);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:7px;}
  .script p{margin:0;font-size:21px;line-height:1.6;font-weight:500;}
  .script p.small{font-size:16px;line-height:1.7;}
  .script .cn{margin:10px 0 0;font-size:15px;line-height:1.65;color:var(--ink-2);font-weight:400;}

  .crit{display:grid;gap:8px;margin-bottom:18px;}
  .crit div{display:flex;gap:10px;font-size:14px;color:var(--ink-2);}
  .crit b{flex:none;width:74px;font-family:var(--f-num);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);padding-top:3px;font-weight:400;}
  .crit .flag{color:var(--warn);}

  .field{border-top:1px solid var(--rule);padding-top:16px;margin-top:4px;}
  .field + .field{margin-top:16px;}
  .flabel{font-family:var(--f-num);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .flabel .hint{text-transform:none;letter-spacing:0;font-family:var(--f-ui);color:var(--ink-3);}

  .tally{display:flex;align-items:center;gap:14px;}
  .tally .num{font-family:var(--f-num);font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;min-width:62px;text-align:center;line-height:1;}
  .knob{appearance:none;cursor:pointer;width:54px;height:54px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:3px;font-size:24px;line-height:1;font-family:var(--f-num);transition:background .1s,border-color .1s;}
  .knob:hover{background:var(--sunk);border-color:var(--ink-3);}
  .knob:active{background:var(--sunk);transform:translateY(1px);}
  .knob:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .knob[disabled]{opacity:.35;cursor:default;}

  .seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;}
  .seg button{appearance:none;cursor:pointer;border:1px solid var(--rule);background:var(--surface);color:var(--ink-2);border-radius:3px;padding:11px 4px 10px;text-align:center;transition:background .1s,border-color .1s,color .1s;}
  .seg button .lv{display:block;font-family:var(--f-num);font-size:15px;font-weight:700;letter-spacing:.04em;}
  .seg button .cap{display:block;font-size:11px;margin-top:3px;color:var(--ink-3);}
  .seg button:hover{border-color:var(--ink-3);}
  .seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface);}
  .seg button[aria-pressed="true"] .cap{color:var(--surface);opacity:.75;}

  .ladder{margin-top:10px;font-size:13px;color:var(--ink-3);line-height:1.8;}
  .ladder code{font-family:var(--f-ui);background:var(--sunk);color:var(--ink-2);padding:1px 5px;border-radius:2px;}

  .chip{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-num);font-size:12px;letter-spacing:.07em;text-transform:uppercase;padding:6px 11px;border-radius:2px;border:1px solid;}
  .chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;}
  .chip.ok{color:var(--ok);border-color:var(--ok);}
  .chip.warn{color:var(--warn);border-color:var(--warn);}
  .chip.bad{color:var(--bad);border-color:var(--bad);}
  .chip.none{color:var(--ink-3);border-color:var(--rule);}

  textarea,input[type="text"]{
    width:100%;font-family:var(--f-ui);font-size:16px;color:var(--ink);
    background:var(--ground);border:1px solid var(--rule);border-radius:3px;
    padding:11px 12px;line-height:1.55;resize:vertical;
  }
  textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent;}
  textarea::placeholder,input::placeholder{color:var(--ink-3);}
  input#f_name{font-family:var(--f-num);font-size:19px;font-weight:700;padding:14px;}

  .over{display:none;align-items:center;gap:9px;margin-top:12px;border:1px solid var(--accent);border-left-width:3px;border-radius:0 3px 3px 0;padding:10px 13px;font-size:14px;color:var(--accent);}
  .over[data-on="1"]{display:flex;}

  .bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--rule);box-shadow:0 -6px 20px rgba(20,24,26,.06);padding-bottom:env(safe-area-inset-bottom);}
  .bar .inner{max-width:720px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;}
  .clock{font-family:var(--f-num);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1;min-width:118px;}
  .clock[data-run="1"],.clock[data-over="1"]{color:var(--accent);}
  .clock .u{font-size:13px;font-weight:400;color:var(--ink-3);letter-spacing:.06em;}

  .btn{appearance:none;cursor:pointer;border:1px solid var(--ink);border-radius:3px;background:var(--ink);color:var(--surface);font-family:var(--f-ui);font-size:15px;font-weight:600;padding:13px 20px;transition:opacity .1s;}
  .btn:hover{opacity:.86;}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .btn.ghost{background:transparent;color:var(--ink-2);border-color:var(--rule);font-weight:500;}
  .btn.ghost:hover{border-color:var(--ink-3);color:var(--ink);}
  .btn.run{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.wide{flex:1;}
  .btn[disabled]{opacity:.4;cursor:default;}

  .ol{margin:0;padding-left:18px;font-size:14px;color:var(--ink-2);line-height:1.75;}
  .ol li{margin-bottom:5px;}
  .ol li::marker{color:var(--ink-3);font-family:var(--f-num);font-size:12px;}

  .sessions{display:grid;gap:6px;margin-top:12px;}
  .sess{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--ground);border:1px solid var(--rule);border-radius:3px;font-size:14px;}
  .sess .pid{font-family:var(--f-num);font-weight:700;}
  .sess .prog{margin-left:auto;font-family:var(--f-num);font-size:12px;color:var(--ink-3);}
  .sess button{appearance:none;cursor:pointer;background:none;border:0;color:var(--ink-3);font-family:var(--f-ui);font-size:13px;padding:2px 4px;text-decoration:underline;text-underline-offset:2px;}
  .sess button:hover{color:var(--accent);}

  .out{width:100%;min-height:300px;font-family:var(--f-num);font-size:12px;line-height:1.6;white-space:pre;overflow-x:auto;}
  .note{font-size:13px;color:var(--ink-3);line-height:1.7;margin:14px 0 0;padding-top:12px;border-top:1px solid var(--rule);}
  .note b{color:var(--warn);font-weight:600;}
  .saved{font-family:var(--f-num);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ok);opacity:0;transition:opacity .3s;margin-left:auto;}
  .saved[data-on="1"]{opacity:1;}

  @media (prefers-reduced-motion: reduce){*{transition:none !important;}}
</style>
</head>
<body>

<div class="wrap">
  <div class="mast">
    <h1>Guided Session Recorder</h1>
    <span class="sub">Usability · 5 tasks · 5 min cap</span>
    <span class="who" id="who"></span>
  </div>
  <nav class="rail" id="rail" aria-label="Session steps"></nav>
  <div id="panel"></div>
</div>

<div class="bar"><div class="inner" id="bar"></div></div>

<script>
(function () {
  "use strict";

  var KEY = "usability_recorder_v1";
  var LIMIT = 300;

  var TASKS = [
    { id:"T1", name:"Read the daily load",
      script:"Please log in, then tell me how many vocabulary cards are due for review today.",
      cn:"请登录，然后告诉我：今天有多少张单词卡等着复习。",
      pass:"The number spoken matches the due count on the dashboard",
      covers:"Login · dashboard information architecture", flag:"" },
    { id:"T2", name:"Generate a passage and answer it",
      script:"Please generate a reading passage, read it, answer all the questions that follow, then tell me how many you got right.",
      cn:"请生成一篇阅读文章，读完，把后面的题目全部做完，然后告诉我你对了几道。",
      pass:"Runs generation to reading to answering to seeing a score",
      covers:"AI generation path · waiting feedback",
      flag:"Repeated clicking while waiting counts as a wrong turn" },
    { id:"T3", name:"Add an unknown word to the plan",
      script:"Pick a word from that passage you did not know, and add it to your vocabulary study plan.",
      cn:"刚才那篇文章里，挑一个你不认识的词，把它加到你的单词学习计划里去。",
      pass:"The word can afterwards be found in the vocabulary plan",
      covers:"Cross-module vocabulary contextualisation",
      flag:"The core of the integration claim. Getting stuck here is the most valuable result" },
    { id:"T4", name:"Review it and read the interval",
      script:"Now go and review that word. When you are done, tell me when the system says you will see it again.",
      cn:"现在去复习这个词，复习完以后告诉我：系统说下一次什么时候再让你见到它。",
      pass:"Completes one review and states the next due date or interval",
      covers:"Whether the scheduler is visible to the learner", flag:"" },
    { id:"T5", name:"Submit writing and read the feedback",
      script:"Please submit a piece of writing. Once the feedback is back, tell me which of the four scoring dimensions you scored lowest on.",
      cn:"请提交一篇写作，拿到反馈以后告诉我：四个评分维度里，哪一个你的分最低。",
      pass:"The dimension named matches the one the system scored lowest",
      covers:"Band-descriptor-aligned feedback",
      flag:"Have a 250-word text ready to paste. Do not make anyone write on the spot" }
  ];

  var LADDER = [
    { lv:"L0", cap:"none" },
    { lv:"L1", cap:"direction" },
    { lv:"L2", cap:"location" },
    { lv:"L3", cap:"demo" }
  ];

  var DEBRIEF = [
    { k:"stuck",  q:"Which step was the most frustrating?" },
    { k:"useful", q:"Which part of this would actually help your IELTS preparation?" },
    { k:"change", q:"If you could change one thing, what would it be?" }
  ];

  var step = 0, s = blank(), tick = null, savedTimer = null;

  function today() {
    var d = new Date(), p = function (n) { return (n < 10 ? "0" : "") + n; };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }
  function blank() {
    return {
      name: "", date: today(),
      tasks: TASKS.map(function () { return { secs:0, running:false, startedAt:0, wrong:0, hint:null, quote:"" }; }),
      debrief: { stuck:"", useful:"", change:"" }
    };
  }
  function store() { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { return {}; } }
  function save() {
    if (!s.name) return;
    var all = store(); all[s.name] = s;
    try { localStorage.setItem(KEY, JSON.stringify(all)); } catch (e) {}
    var el = document.getElementById("savedFlag");
    if (!el) return;
    el.setAttribute("data-on", "1");
    clearTimeout(savedTimer);
    savedTimer = setTimeout(function () { el.setAttribute("data-on", "0"); }, 1200);
  }

  function liveSecs(t) { return t.running ? t.secs + Math.floor((Date.now() - t.startedAt) / 1000) : t.secs; }
  function outcome(t) {
    if (liveSecs(t) >= LIMIT) return { k:"bad",  label:"Failed · timeout",  en:"failed (timeout)" };
    if (t.hint === 3)         return { k:"bad",  label:"Failed · demonstrated", en:"failed (demonstrated)" };
    if (t.hint === 1 || t.hint === 2) return { k:"warn", label:"With hint", en:"with hint" };
    if (t.hint === 0)         return { k:"ok",   label:"Independent", en:"independent" };
    return { k:"none", label:"Not recorded", en:"not recorded" };
  }
  function mmss(sec) { var m = Math.floor(sec/60), r = sec%60; return m + ":" + (r<10?"0":"") + r; }
  function done(i) { var t = s.tasks[i]; return t.hint !== null || liveSecs(t) >= LIMIT; }
  function esc(x) { return String(x).replace(/[&<>"]/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];}); }

  function startLoop() {
    if (tick) return;
    tick = setInterval(function () {
      var t = s.tasks[step-1];
      if (!t || !t.running) return;
      paintClock();
      var el = document.getElementById("over");
      if (el) el.setAttribute("data-on", liveSecs(t) >= LIMIT ? "1" : "0");
    }, 250);
  }
  function stopLoop() { clearInterval(tick); tick = null; }
  function paintClock() {
    var c = document.getElementById("clock"); if (!c) return;
    var t = s.tasks[step-1]; if (!t) return;
    var sec = liveSecs(t);
    c.firstChild.nodeValue = mmss(sec);
    c.setAttribute("data-run", t.running ? "1" : "0");
    c.setAttribute("data-over", sec >= LIMIT ? "1" : "0");
  }
  function paintWho() {
    document.getElementById("who").textContent = s.name ? (s.name + " · " + s.date) : "";
  }
  function bindText(id, fn) {
    var el = document.getElementById(id); if (!el) return;
    el.oninput = function () { fn(el.value); };
  }
  function mkBtn(label, cls, fn) {
    var b = document.createElement("button");
    b.type = "button"; b.className = cls; b.textContent = label; b.onclick = fn;
    return b;
  }

  function render() {
    paintWho(); renderRail();
    if (step === 0) renderSetup(); else if (step === 6) renderWrap(); else renderTask(step-1);
    renderBar();
  }

  function renderRail() {
    var rail = document.getElementById("rail");
    var labels = ["Setup"].concat(TASKS.map(function(t){return t.id;})).concat(["Wrap"]);
    rail.innerHTML = "";
    labels.forEach(function (lab, i) {
      var b = document.createElement("button");
      b.type = "button"; b.textContent = lab;
      if (i === step) b.setAttribute("aria-current", "true");
      else if (i >= 1 && i <= 5 && done(i-1)) b.setAttribute("data-state", "done");
      b.onclick = function () { go(i); };
      rail.appendChild(b);
    });
  }

  function renderSetup() {
    var all = store(), names = Object.keys(all).sort();
    var rows = names.map(function (n) {
      var r = all[n];
      var c = r.tasks.filter(function (t) { return t.hint !== null; }).length;
      return '<div class="sess"><span class="pid">' + esc(n) + '</span><span>' + esc(r.date) +
             '</span><span class="prog">' + c + '/5</span>' +
             '<button type="button" data-load="' + esc(n) + '">Load</button>' +
             '<button type="button" data-del="' + esc(n) + '">Delete</button></div>';
    }).join("");

    document.getElementById("panel").innerHTML =
      '<div class="card">' +
        '<p class="eyebrow"><span class="tag">Start</span> Who this session is with' +
          '<span class="saved" id="savedFlag" data-on="0">Saved</span></p>' +
        '<h2>Enter a name to begin</h2>' +
        '<p class="meta">The name only separates one session from another. It stays in this browser and is never uploaded. It becomes P1 to P5 when the data reaches the dissertation.</p>' +
        '<input type="text" id="f_name" placeholder="e.g. Wang" autocomplete="off" value="' + esc(s.name) + '">' +
        '<div class="field">' +
          '<p class="flabel">Before you start</p>' +
          '<ol class="ol">' +
            '<li>Consent form signed on the spot</li>' +
            '<li>This person <strong>did not take the earlier questionnaire</strong></li>' +
            '<li>Seeded account ready, but <strong>leave the dashboard closed</strong></li>' +
            '<li>Browser cleared: no history, no autofill</li>' +
            '<li>A 250-word text ready to paste for T5</li>' +
          '</ol>' +
        '</div>' +
      '</div>' +

      '<div class="card">' +
        '<p class="eyebrow"><span class="tag">Read aloud</span> Same words for all five</p>' +
        '<div class="script"><span class="lab">Opening</span><p class="small">' +
          'What is being tested here is the system, not you. If something does not work, that is the system’s problem, not yours.<br><br>' +
          'There are five tasks. Please think aloud as you go: what you are looking for, what you expect a click to do, where you hesitate.<br><br>' +
          'I will not answer questions like “where is that button”. If you get stuck, keep trying, and if you really cannot get past it I will give you a hint. Your actions and timings are being recorded. Nothing is filmed.<br><br>' +
          'You can stop at any point, and you do not need a reason.' +
        '</p>' +
        '<p class="cn">今天测的是这个系统，不是你。做不出来是系统的问题。五个任务，请边做边说出你在想什么。我不会回答「这个按钮在哪」，卡住了就继续试，实在过不去我会给提示。全程记录操作和用时，不录像。随时可以停下，不需要理由。</p>' +
        '</div>' +
      '</div>' +

      (names.length
        ? '<div class="card"><p class="eyebrow"><span class="tag">This device</span> ' + names.length + ' session' + (names.length > 1 ? 's' : '') + ' saved</p>' +
          '<div class="sessions">' + rows + '</div>' +
          '<div style="margin-top:14px"><button class="btn ghost" type="button" id="dumpAll">Export all ' + names.length + '</button></div>' +
          '<textarea class="out" id="allOut" readonly style="display:none;margin-top:12px"></textarea>' +
          '<p class="note">Everything lives in this browser only. Switching device or clearing the cache loses it, so <b>export each session as soon as it ends.</b></p></div>'
        : '');

    bindText("f_name", function (v) { s.name = v.trim(); save(); paintWho(); renderBar(); });

    Array.prototype.forEach.call(document.querySelectorAll("[data-load]"), function (b) {
      b.onclick = function () { var r = store()[b.getAttribute("data-load")]; if (r) { s = r; step = 0; render(); } };
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-del]"), function (b) {
      b.onclick = function () {
        var n = b.getAttribute("data-del"), all = store();
        delete all[n];
        try { localStorage.setItem(KEY, JSON.stringify(all)); } catch (e) {}
        if (s.name === n) s = blank();
        render();
      };
    });
    var dump = document.getElementById("dumpAll");
    if (dump) dump.onclick = function () {
      var all = store(), ta = document.getElementById("allOut");
      ta.value = Object.keys(all).sort().map(function (n) { return recordOf(all[n]); }).join("\n\n---\n\n");
      ta.style.display = "block";
      ta.select();
      try { document.execCommand("copy"); dump.textContent = "All copied"; }
      catch (e) { dump.textContent = "Select and copy manually"; }
      setTimeout(function () { dump.textContent = "Export all " + Object.keys(all).length; }, 1800);
    };
  }

  function renderTask(i) {
    var T = TASKS[i], t = s.tasks[i], o = outcome(t);
    var segs = LADDER.map(function (L, k) {
      return '<button type="button" data-hint="' + k + '" aria-pressed="' + (t.hint === k) + '">' +
             '<span class="lv">' + L.lv + '</span><span class="cap">' + L.cap + '</span></button>';
    }).join("");

    document.getElementById("panel").innerHTML =
      '<div class="card">' +
        '<p class="eyebrow"><span class="tag">' + T.id + '</span> Task ' + (i+1) + ' of 5' +
          '<span class="saved" id="savedFlag" data-on="0">Saved</span></p>' +
        '<h2>' + esc(T.name) + '</h2>' +
        '<div class="script"><span class="lab">Read to the participant</span>' +
          '<p>' + esc(T.script) + '</p>' +
          '<p class="cn">' + esc(T.cn) + '</p></div>' +
        '<div class="crit">' +
          '<div><b>Success</b><span>' + esc(T.pass) + '</span></div>' +
          '<div><b>Covers</b><span>' + esc(T.covers) + '</span></div>' +
          (T.flag ? '<div><b>Watch for</b><span class="flag">' + esc(T.flag) + '</span></div>' : '') +
        '</div>' +
        '<div class="field">' +
          '<p class="flabel">Wrong turns <span class="hint">wrong button · wrong page · duplicate submit, one each</span></p>' +
          '<div class="tally">' +
            '<button class="knob" type="button" id="w_dn"' + (t.wrong === 0 ? " disabled" : "") + '>&minus;</button>' +
            '<span class="num">' + t.wrong + '</span>' +
            '<button class="knob" type="button" id="w_up">+</button>' +
          '</div>' +
        '</div>' +
        '<div class="field">' +
          '<p class="flabel">Hint level <span class="hint">no skipping levels; wait 30 s before escalating</span></p>' +
          '<div class="seg" id="seg">' + segs + '</div>' +
          '<div class="ladder">L1 <code>There is somewhere else on this page worth looking at.</code><br>' +
            'L2 <code>Try the navigation on the left.</code> (a direction, never the button itself)<br>' +
            'L3 demonstrate it = counts as failed</div>' +
          '<div style="margin-top:14px"><span class="chip ' + o.k + '">' + o.label + '</span></div>' +
          '<div class="over" id="over" data-on="' + (liveSecs(t) >= LIMIT ? "1" : "0") + '">Five minutes reached. This task is failed. Stop the clock and move on.</div>' +
        '</div>' +
        '<div class="field">' +
          '<p class="flabel">Verbatim quote <span class="hint">word for word, not paraphrased</span></p>' +
          '<textarea id="q" rows="3" placeholder="&quot;I thought this one was the search box...&quot;">' + esc(t.quote) + '</textarea>' +
        '</div>' +
      '</div>';

    document.getElementById("w_up").onclick = function () { t.wrong++; save(); renderTask(i); };
    document.getElementById("w_dn").onclick = function () { if (t.wrong > 0) t.wrong--; save(); renderTask(i); };
    Array.prototype.forEach.call(document.querySelectorAll("#seg button"), function (b) {
      b.onclick = function () {
        var k = parseInt(b.getAttribute("data-hint"), 10);
        t.hint = (t.hint === k) ? null : k;
        save(); renderTask(i); renderRail();
      };
    });
    bindText("q", function (v) { t.quote = v; save(); });
    paintClock();
  }

  function renderWrap() {
    var fields = DEBRIEF.map(function (d) {
      return '<div class="field"><p class="flabel">' + esc(d.q) + '</p>' +
             '<textarea id="d_' + d.k + '" rows="2" placeholder="record the actual words">' + esc(s.debrief[d.k]) + '</textarea></div>';
    }).join("");

    document.getElementById("panel").innerHTML =
      '<div class="card">' +
        '<p class="eyebrow"><span class="tag">Wrap</span> Spoken debrief · 5 min' +
          '<span class="saved" id="savedFlag" data-on="0">Saved</span></p>' +
        '<h2>Three questions, recorded verbatim</h2>' +
        '<p class="meta">Do not let the participant fill in the in-platform questionnaire. That sample is closed, and extra rows would break statistics that have already been checked against the database.</p>' +
        fields +
      '</div>' +
      '<div class="card">' +
        '<p class="eyebrow"><span class="tag">Export</span> Copy it out</p>' +
        '<textarea class="out" id="out" readonly></textarea>' +
        '<p class="note">Aggregate once all five are done. With n = 5, write "4 of 5", <b>never a percentage</b> — 20% granularity cannot carry that precision.</p>' +
      '</div>';

    DEBRIEF.forEach(function (d) { bindText("d_" + d.k, function (v) { s.debrief[d.k] = v; save(); paintOut(); }); });
    paintOut();
  }

  function recordOf(r) {
    var L = [];
    L.push("## " + (r.name || "?") + " · " + r.date);
    L.push("");
    L.push("| Task | Outcome | Time | Wrong turns | Hint | Verbatim |");
    L.push("|---|---|---:|---:|---|---|");
    TASKS.forEach(function (T, i) {
      var t = r.tasks[i], o = outcome(t), sec = liveSecs(t);
      L.push("| " + T.id + " " + T.name + " | " + o.en + " | " + sec + " s | " + t.wrong + " | " +
             (t.hint === null ? "—" : LADDER[t.hint].lv) + " | " +
             ((t.quote || "").replace(/\n/g, " ").replace(/\|/g, "/") || "—") + " |");
    });
    L.push("");
    L.push("**Debrief**");
    DEBRIEF.forEach(function (d) { L.push("- " + d.q + "  " + ((r.debrief[d.k] || "").replace(/\n/g, " ") || "—")); });
    L.push("");
    L.push("```json");
    L.push(JSON.stringify({
      name: r.name, date: r.date,
      tasks: TASKS.map(function (T, i) {
        var t = r.tasks[i];
        return { id:T.id, secs:liveSecs(t), wrong:t.wrong, hint:t.hint, outcome:outcome(t).en, quote:t.quote };
      }),
      debrief: r.debrief
    }, null, 1));
    L.push("```");
    return L.join("\n");
  }

  function paintOut() {
    var el = document.getElementById("out");
    if (el) el.value = recordOf(s);
  }

  function renderBar() {
    var bar = document.getElementById("bar");
    bar.innerHTML = "";

    if (step === 0) {
      var start = mkBtn("Start T1", "btn wide", function () { go(1); });
      if (!s.name) start.disabled = true;
      bar.appendChild(start);
      stopLoop();
      return;
    }
    if (step === 6) {
      bar.appendChild(mkBtn("Back", "btn ghost", function () { go(5); }));
      var copyBtn = mkBtn("Copy this session", "btn wide", function () {
        var o = document.getElementById("out");
        o.select(); o.setSelectionRange(0, 999999);
        var ok = false;
        try { ok = document.execCommand("copy"); } catch (e) {}
        copyBtn.textContent = ok ? "Copied" : "Select and copy manually";
        setTimeout(function () { copyBtn.textContent = "Copy this session"; }, 1600);
      });
      bar.appendChild(copyBtn);
      stopLoop();
      return;
    }

    var t = s.tasks[step-1];
    var clock = document.createElement("span");
    clock.className = "clock"; clock.id = "clock";
    clock.appendChild(document.createTextNode(mmss(liveSecs(t))));
    var u = document.createElement("span"); u.className = "u"; u.textContent = " / 5:00";
    clock.appendChild(u);
    bar.appendChild(clock);

    if (!t.running) {
      bar.appendChild(mkBtn(t.secs === 0 ? "Start timer" : "Resume", "btn run", function () {
        t.running = true; t.startedAt = Date.now(); save(); renderBar(); startLoop();
      }));
    } else {
      bar.appendChild(mkBtn("Stop", "btn", function () {
        t.secs = liveSecs(t); t.running = false; save(); renderBar(); paintClock();
      }));
    }
    bar.appendChild(mkBtn(step === 5 ? "Wrap up →" : "Next →", "btn ghost", function () {
      if (t.running) { t.secs = liveSecs(t); t.running = false; }
      save(); go(step + 1);
    }));

    paintClock();
    if (t.running) startLoop(); else stopLoop();
  }

  function go(n) {
    var cur = s.tasks[step-1];
    if (cur && cur.running) { cur.secs = liveSecs(cur); cur.running = false; }
    step = Math.max(0, Math.min(6, n));
    save(); render(); window.scrollTo(0, 0);
  }

  window.addEventListener("beforeunload", function () {
    var cur = s.tasks[step-1];
    if (cur && cur.running) { cur.secs = liveSecs(cur); cur.running = false; save(); }
  });

  render();
})();
</script>
</body>
</html>
