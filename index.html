<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Guided Session Recorder</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>⏱</text></svg>">
<style>
  :root {
    --ground:#E9EBE7; --surface:#FBFBF9; --sunk:#E2E5E0;
    --ink:#14181A; --ink-2:#4A5350; --ink-3:#7C8582; --rule:#CDD2CB;
    --accent:#B33A2B; --ok:#1E6B45; --warn:#8A6212; --bad:#8E2A1E;
    --shadow:0 1px 2px rgba(20,24,26,.06), 0 8px 24px rgba(20,24,26,.05);
    --f-ui:"Helvetica Neue", Arial, "Microsoft YaHei", "PingFang SC", sans-serif;
    --f-num:ui-monospace, "SF Mono", "Cascadia Mono", Consolas, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground:#131719; --surface:#1B2023; --sunk:#23292C;
      --ink:#E8EBE7; --ink-2:#A3ABA7; --ink-3:#6F7A75; --rule:#2E3538;
      --accent:#E06850; --ok:#4FA97A; --warn:#D19A3C; --bad:#D26A56;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"]{--ground:#131719;--surface:#1B2023;--sunk:#23292C;--ink:#E8EBE7;--ink-2:#A3ABA7;--ink-3:#6F7A75;--rule:#2E3538;--accent:#E06850;--ok:#4FA97A;--warn:#D19A3C;--bad:#D26A56;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);}
  :root[data-theme="light"]{--ground:#E9EBE7;--surface:#FBFBF9;--sunk:#E2E5E0;--ink:#14181A;--ink-2:#4A5350;--ink-3:#7C8582;--rule:#CDD2CB;--accent:#B33A2B;--ok:#1E6B45;--warn:#8A6212;--bad:#8E2A1E;--shadow:0 1px 2px rgba(20,24,26,.06),0 8px 24px rgba(20,24,26,.05);}

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ground); color:var(--ink); font-family:var(--f-ui);
    font-size:16px; line-height:1.5; min-height:100vh;
    padding:0 0 max(108px, calc(88px + env(safe-area-inset-bottom)));
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:720px;margin:0 auto;padding:0 16px;}

  .mast{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:20px 0 14px;}
  .mast h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em;}
  .mast .sub{font-family:var(--f-num);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);}
  .mast .who{font-family:var(--f-num);font-size:12px;color:var(--ink-2);}
  .mast .spacer{margin-left:auto;}
  .lang{appearance:none;cursor:pointer;background:var(--sunk);border:1px solid var(--rule);color:var(--ink-2);border-radius:2px;font-family:var(--f-num);font-size:11px;letter-spacing:.08em;padding:5px 10px;}
  .lang:hover{color:var(--ink);border-color:var(--ink-3);}
  .lang:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .rail{display:flex;gap:3px;margin-bottom:18px;}
  .rail button{
    flex:1;appearance:none;border:0;cursor:pointer;background:var(--sunk);color:var(--ink-3);
    font-family:var(--f-num);font-size:11px;letter-spacing:.04em;padding:7px 2px 6px;
    border-radius:2px;border-bottom:2px solid transparent;
    transition:color .12s,border-color .12s,background .12s;
  }
  .rail button:hover{color:var(--ink-2);}
  .rail button[data-state="done"]{color:var(--ok);border-bottom-color:var(--ok);}
  .rail button[aria-current="true"]{background:var(--surface);color:var(--ink);border-bottom-color:var(--accent);font-weight:700;}
  .rail button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .card{background:var(--surface);border:1px solid var(--rule);border-radius:4px;box-shadow:var(--shadow);padding:20px;margin-bottom:14px;}
  .eyebrow{font-family:var(--f-num);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px;display:flex;gap:10px;align-items:center;}
  .eyebrow .tag{background:var(--sunk);color:var(--ink-2);padding:2px 7px;border-radius:2px;letter-spacing:.06em;}
  h2{margin:0 0 4px;font-size:21px;font-weight:700;letter-spacing:-.015em;text-wrap:balance;}
  .meta{color:var(--ink-3);font-size:13px;margin:0 0 16px;line-height:1.6;}

  .script{background:var(--sunk);border-left:3px solid var(--accent);border-radius:0 3px 3px 0;padding:16px 18px;margin:0 0 16px;}
  .script .lab{font-family:var(--f-num);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:7px;}
  .script p{margin:0;font-size:21px;line-height:1.6;font-weight:500;}
  .script p.small{font-size:16px;line-height:1.7;}
  .script .alt{margin:12px 0 0;padding-top:10px;border-top:1px solid var(--rule);font-size:15px;line-height:1.65;color:var(--ink-2);font-weight:400;}
  .script .alt .code{font-family:var(--f-num);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:5px;}

  .crit{display:grid;gap:8px;margin-bottom:18px;}
  .crit div{display:flex;gap:10px;font-size:14px;color:var(--ink-2);}
  .crit b{flex:none;width:80px;font-family:var(--f-num);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);padding-top:3px;font-weight:400;}
  .crit .flag{color:var(--warn);}

  .field{border-top:1px solid var(--rule);padding-top:16px;margin-top:4px;}
  .field + .field{margin-top:16px;}
  .flabel{font-family:var(--f-num);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .flabel .hint{text-transform:none;letter-spacing:0;font-family:var(--f-ui);color:var(--ink-3);}

  .tally{display:flex;align-items:center;gap:14px;}
  .tally .num{font-family:var(--f-num);font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;min-width:62px;text-align:center;line-height:1;}
  .knob{appearance:none;cursor:pointer;width:54px;height:54px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:3px;font-size:24px;line-height:1;font-family:var(--f-num);transition:background .1s,border-color .1s;}
  .knob:hover{background:var(--sunk);border-color:var(--ink-3);}
  .knob:active{background:var(--sunk);transform:translateY(1px);}
  .knob:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .knob[disabled]{opacity:.35;cursor:default;}

  .seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;}
  .seg button{appearance:none;cursor:pointer;border:1px solid var(--rule);background:var(--surface);color:var(--ink-2);border-radius:3px;padding:11px 4px 10px;text-align:center;transition:background .1s,border-color .1s,color .1s;}
  .seg button .lv{display:block;font-family:var(--f-num);font-size:15px;font-weight:700;letter-spacing:.04em;}
  .seg button .cap{display:block;font-size:11px;margin-top:3px;color:var(--ink-3);}
  .seg button:hover{border-color:var(--ink-3);}
  .seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface);}
  .seg button[aria-pressed="true"] .cap{color:var(--surface);opacity:.75;}

  .ladder{margin-top:10px;font-size:13px;color:var(--ink-3);line-height:1.8;}
  .ladder code{font-family:var(--f-ui);background:var(--sunk);color:var(--ink-2);padding:1px 5px;border-radius:2px;}

  .chip{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-num);font-size:12px;letter-spacing:.07em;text-transform:uppercase;padding:6px 11px;border-radius:2px;border:1px solid;}
  .chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;}
  .chip.ok{color:var(--ok);border-color:var(--ok);}
  .chip.warn{color:var(--warn);border-color:var(--warn);}
  .chip.bad{color:var(--bad);border-color:var(--bad);}
  .chip.none{color:var(--ink-3);border-color:var(--rule);}

  textarea,input[type="text"]{
    width:100%;font-family:var(--f-ui);font-size:16px;color:var(--ink);
    background:var(--ground);border:1px solid var(--rule);border-radius:3px;
    padding:11px 12px;line-height:1.55;resize:vertical;
  }
  textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent;}
  textarea::placeholder,input::placeholder{color:var(--ink-3);}
  input#f_name{font-family:var(--f-num);font-size:19px;font-weight:700;padding:14px;}

  .over{display:none;align-items:center;gap:9px;margin-top:12px;border:1px solid var(--accent);border-left-width:3px;border-radius:0 3px 3px 0;padding:10px 13px;font-size:14px;color:var(--accent);}
  .over[data-on="1"]{display:flex;}

  .bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--rule);box-shadow:0 -6px 20px rgba(20,24,26,.06);padding-bottom:env(safe-area-inset-bottom);}
  .bar .inner{max-width:720px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;}
  .clock{font-family:var(--f-num);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1;min-width:118px;}
  .clock[data-run="1"],.clock[data-over="1"]{color:var(--accent);}
  .clock .u{font-size:13px;font-weight:400;color:var(--ink-3);letter-spacing:.06em;}

  .btn{appearance:none;cursor:pointer;border:1px solid var(--ink);border-radius:3px;background:var(--ink);color:var(--surface);font-family:var(--f-ui);font-size:15px;font-weight:600;padding:13px 20px;transition:opacity .1s;}
  .btn:hover{opacity:.86;}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .btn.ghost{background:transparent;color:var(--ink-2);border-color:var(--rule);font-weight:500;}
  .btn.ghost:hover{border-color:var(--ink-3);color:var(--ink);}
  .btn.run{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.wide{flex:1;}
  .btn[disabled]{opacity:.4;cursor:default;}

  .ol{margin:0;padding-left:18px;font-size:14px;color:var(--ink-2);line-height:1.75;}
  .ol li{margin-bottom:5px;}
  .ol li::marker{color:var(--ink-3);font-family:var(--f-num);font-size:12px;}

  .sessions{display:grid;gap:6px;margin-top:12px;}
  .sess{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--ground);border:1px solid var(--rule);border-radius:3px;font-size:14px;}
  .sess .pid{font-family:var(--f-num);font-weight:700;}
  .sess .prog{margin-left:auto;font-family:var(--f-num);font-size:12px;color:var(--ink-3);}
  .sess button{appearance:none;cursor:pointer;background:none;border:0;color:var(--ink-3);font-family:var(--f-ui);font-size:13px;padding:2px 4px;text-decoration:underline;text-underline-offset:2px;}
  .sess button:hover{color:var(--accent);}

  .out{width:100%;min-height:300px;font-family:var(--f-num);font-size:12px;line-height:1.6;white-space:pre;overflow-x:auto;}
  .note{font-size:13px;color:var(--ink-3);line-height:1.7;margin:14px 0 0;padding-top:12px;border-top:1px solid var(--rule);}
  .note b{color:var(--warn);font-weight:600;}
  .saved{font-family:var(--f-num);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ok);opacity:0;transition:opacity .3s;margin-left:auto;}
  .saved[data-on="1"]{opacity:1;}

  .tblwrap{overflow-x:auto;margin:0 0 4px;}
  table.agg{border-collapse:collapse;width:100%;font-size:14px;}
  table.agg th{font-family:var(--f-num);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:400;text-align:right;padding:0 0 9px 14px;border-bottom:1px solid var(--rule);white-space:nowrap;}
  table.agg th:first-child{text-align:left;padding-left:0;}
  table.agg td{padding:11px 0 11px 14px;border-bottom:1px solid var(--rule);text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-num);white-space:nowrap;}
  table.agg td:first-child{text-align:left;padding-left:0;font-family:var(--f-ui);color:var(--ink-2);white-space:normal;}
  table.agg td .id{font-family:var(--f-num);font-weight:700;color:var(--ink);margin-right:7px;}
  table.agg td.ok{color:var(--ok);font-weight:700;}
  table.agg td.zero{color:var(--ink-3);}
  table.agg td.bad{color:var(--bad);font-weight:700;}

  .qgroup{margin-top:8px;}
  .qgroup h3{font-family:var(--f-num);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:400;margin:16px 0 6px;}
  .qgroup p{margin:0 0 6px;font-size:14px;color:var(--ink-2);padding-left:12px;border-left:2px solid var(--rule);}
  .qgroup p .src{font-family:var(--f-num);font-size:11px;color:var(--ink-3);margin-right:8px;}

  @media (prefers-reduced-motion: reduce){*{transition:none !important;}}
</style>
</head>
<body>

<div class="wrap">
  <div class="mast">
    <h1 id="mTitle"></h1>
    <span class="sub" id="mSub"></span>
    <span class="spacer"></span>
    <span class="who" id="who"></span>
    <button class="lang" type="button" id="langBtn"></button>
  </div>
  <nav class="rail" id="rail"></nav>
  <div id="panel"></div>
</div>

<div class="bar"><div class="inner" id="bar"></div></div>

<script src="vendor/i18next.min.js"></script>
<script src="locales/en.js"></script>
<script src="locales/zh.js"></script>
<script>
(function () {
  "use strict";

  var KEY = "usability_recorder_v1";
  var LANG_KEY = "usability_recorder_lang";
  var LIMIT = 300;
  var IDS = ["T1", "T2", "T3", "T4", "T5"];
  var DEBRIEF_KEYS = ["stuck", "useful", "change"];

  // ---------- i18n ----------
  function initialLang() {
    try {
      var stored = localStorage.getItem(LANG_KEY);
      if (stored === "en" || stored === "zh") return stored;
    } catch (e) {}
    return (navigator.language || "en").toLowerCase().indexOf("zh") === 0 ? "zh" : "en";
  }

  i18next.init({
    lng: initialLang(),
    fallbackLng: "en",
    ns: ["ui", "script", "task"],
    defaultNS: "ui",
    resources: { en: window.__RES.en, zh: window.__RES.zh },
    interpolation: { escapeValue: false }
  });

  function t(k, o) { return i18next.t(k, o); }
  // Exports are always English so the record drops straight into the write-up,
  // whatever language the interface happens to be showing.
  var tEn = i18next.getFixedT("en");
  function tOther(k, o) { return i18next.getFixedT(i18next.language === "en" ? "zh" : "en")(k, o); }
  function otherCode() { return i18next.language === "en" ? "ZH" : "EN"; }

  function setLang(code) {
    i18next.changeLanguage(code, function () {
      try { localStorage.setItem(LANG_KEY, code); } catch (e) {}
      document.documentElement.setAttribute("lang", code === "zh" ? "zh-CN" : "en");
      render();
    });
  }

  // ---------- state ----------
  var step = 0, s = blank(), tick = null, savedTimer = null;

  function today() {
    var d = new Date(), p = function (n) { return (n < 10 ? "0" : "") + n; };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }
  function blank() {
    return {
      name: "", date: today(),
      tasks: IDS.map(function () { return { secs:0, running:false, startedAt:0, wrong:0, hint:null, quote:"" }; }),
      debrief: { stuck:"", useful:"", change:"" }
    };
  }
  function store() { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { return {}; } }
  function save() {
    if (!s.name) return;
    var all = store(); all[s.name] = s;
    try { localStorage.setItem(KEY, JSON.stringify(all)); } catch (e) {}
    var el = document.getElementById("savedFlag");
    if (!el) return;
    el.setAttribute("data-on", "1");
    clearTimeout(savedTimer);
    savedTimer = setTimeout(function () { el.setAttribute("data-on", "0"); }, 1200);
  }

  function liveSecs(x) { return x.running ? x.secs + Math.floor((Date.now() - x.startedAt) / 1000) : x.secs; }
  function outcome(x) {
    if (liveSecs(x) >= LIMIT) return { key:"failed", en:"failed (timeout)", k:"bad",  label:t("outFailTimeout") };
    if (x.hint === 3)         return { key:"failed", en:"failed (demonstrated)", k:"bad", label:t("outFailDemo") };
    if (x.hint === 1 || x.hint === 2) return { key:"hint", en:"with hint", k:"warn", label:t("outWithHint") };
    if (x.hint === 0)         return { key:"independent", en:"independent", k:"ok", label:t("outIndependent") };
    return { key:"none", en:"not recorded", k:"none", label:t("outNotRecorded") };
  }
  function mmss(sec) { var m = Math.floor(sec/60), r = sec%60; return m + ":" + (r<10?"0":"") + r; }
  function done(i) { var x = s.tasks[i]; return x.hint !== null || liveSecs(x) >= LIMIT; }
  function esc(x) { return String(x).replace(/[&<>"]/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];}); }
  function median(a) {
    if (!a.length) return null;
    var b = a.slice().sort(function (p, q) { return p - q; }), m = Math.floor(b.length / 2);
    return b.length % 2 ? b[m] : Math.round((b[m-1] + b[m]) / 2);
  }

  // ---------- timer ----------
  function startLoop() {
    if (tick) return;
    tick = setInterval(function () {
      var x = s.tasks[step-1];
      if (!x || !x.running) return;
      paintClock();
      var el = document.getElementById("over");
      if (el) el.setAttribute("data-on", liveSecs(x) >= LIMIT ? "1" : "0");
    }, 250);
  }
  function stopLoop() { clearInterval(tick); tick = null; }
  function paintClock() {
    var c = document.getElementById("clock"); if (!c) return;
    var x = s.tasks[step-1]; if (!x) return;
    var sec = liveSecs(x);
    c.firstChild.nodeValue = mmss(sec);
    c.setAttribute("data-run", x.running ? "1" : "0");
    c.setAttribute("data-over", sec >= LIMIT ? "1" : "0");
  }

  function bindText(id, fn) {
    var el = document.getElementById(id); if (!el) return;
    el.oninput = function () { fn(el.value); };
  }
  function mkBtn(label, cls, fn) {
    var b = document.createElement("button");
    b.type = "button"; b.className = cls; b.textContent = label; b.onclick = fn;
    return b;
  }
  function copyFrom(id, btn, okLabel, backLabel) {
    var o = document.getElementById(id);
    o.style.display = "block";
    o.select(); o.setSelectionRange(0, 999999);
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    btn.textContent = ok ? okLabel : t("copyManually");
    setTimeout(function () { btn.textContent = backLabel; }, 1700);
  }

  // ---------- render ----------
  function render() {
    document.getElementById("mTitle").textContent = t("appTitle");
    document.getElementById("mSub").textContent = t("appSub");
    document.getElementById("who").textContent = s.name ? (s.name + " · " + s.date) : "";
    var lb = document.getElementById("langBtn");
    lb.textContent = tOther("langName");
    lb.onclick = function () { setLang(i18next.language === "en" ? "zh" : "en"); };
    renderRail();
    if (step === 0) renderSetup();
    else if (step === 6) renderWrap();
    else if (step === 7) renderTotals();
    else renderTask(step - 1);
    renderBar();
  }

  function renderRail() {
    var rail = document.getElementById("rail");
    var labels = [t("stepSetup")].concat(IDS).concat([t("stepWrap"), t("stepAnalysis")]);
    rail.innerHTML = "";
    labels.forEach(function (lab, i) {
      var b = document.createElement("button");
      b.type = "button"; b.textContent = lab;
      if (i === step) b.setAttribute("aria-current", "true");
      else if (i >= 1 && i <= 5 && done(i-1)) b.setAttribute("data-state", "done");
      b.onclick = function () { go(i); };
      rail.appendChild(b);
    });
  }

  function renderSetup() {
    var all = store(), names = Object.keys(all).sort();
    var rows = names.map(function (n) {
      var r = all[n];
      var c = r.tasks.filter(function (x) { return x.hint !== null; }).length;
      return '<div class="sess"><span class="pid">' + esc(n) + '</span><span>' + esc(r.date) +
             '</span><span class="prog">' + c + '/5</span>' +
             '<button type="button" data-load="' + esc(n) + '">' + t("load") + '</button>' +
             '<button type="button" data-del="' + esc(n) + '">' + t("del") + '</button></div>';
    }).join("");

    document.getElementById("panel").innerHTML =
      '<div class="card">' +
        '<p class="eyebrow"><span class="tag">' + t("setupTag") + '</span> ' + t("setupEyebrow") +
          '<span class="saved" id="savedFlag" data-on="0">' + t("saved") + '</span></p>' +
        '<h2>' + t("setupHeading") + '</h2>' +
        '<p class="meta">' + t("setupNote") + '</p>' +
        '<input type="text" id="f_name" placeholder="' + esc(t("namePlaceholder")) + '" autocomplete="off" value="' + esc(s.name) + '">' +
        '<div class="field"><p class="flabel">' + t("beforeYouStart") + '</p><ol class="ol">' +
          '<li>' + t("prep1") + '</li><li>' + t("prep2") + '</li><li>' + t("prep3") + '</li>' +
          '<li>' + t("prep4") + '</li><li>' + t("prep5") + '</li></ol></div>' +
      '</div>' +

      '<div class="card">' +
        '<p class="eyebrow"><span class="tag">' + t("readAloudTag") + '</span> ' + t("sameWords") + '</p>' +
        '<div class="script"><span class="lab">' + t("openingLabel") + '</span>' +
          '<p class="small">' + t("script:opening") + '</p>' +
          '<div class="alt"><span class="code">' + otherCode() + '</span>' + tOther("script:opening") + '</div>' +
        '</div>' +
      '</div>' +

      (names.length
        ? '<div class="card"><p class="eyebrow"><span class="tag">' + t("thisDevice") + '</span> ' +
          t("sessionsSaved", { count: names.length }) + '</p>' +
          '<div class="sessions">' + rows + '</div>' +
          '<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">' +
            '<button class="btn ghost" type="button" id="dumpAll">' + t("exportAll", { count: names.length }) + '</button>' +
            '<button class="btn ghost" type="button" id="toTotals">' + t("btnSeeTotals") + '</button>' +
          '</div>' +
          '<textarea class="out" id="allOut" readonly style="display:none;margin-top:12px"></textarea>' +
          '<p class="note">' + t("storageNote") + '</p></div>'
        : '');

    bindText("f_name", function (v) { s.name = v.trim(); save(); document.getElementById("who").textContent = s.name ? (s.name + " · " + s.date) : ""; renderBar(); });

    Array.prototype.forEach.call(document.querySelectorAll("[data-load]"), function (b) {
      b.onclick = function () { var r = store()[b.getAttribute("data-load")]; if (r) { s = r; step = 0; render(); } };
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-del]"), function (b) {
      b.onclick = function () {
        var n = b.getAttribute("data-del"), all2 = store();
        delete all2[n];
        try { localStorage.setItem(KEY, JSON.stringify(all2)); } catch (e) {}
        if (s.name === n) s = blank();
        render();
      };
    });
    var dump = document.getElementById("dumpAll");
    if (dump) dump.onclick = function () {
      var all2 = store(), ta = document.getElementById("allOut");
      ta.value = Object.keys(all2).sort().map(function (n) { return recordOf(all2[n]); }).join("\n\n---\n\n");
      copyFrom("allOut", dump, t("allCopied"), t("exportAll", { count: Object.keys(all2).length }));
    };
    var tot = document.getElementById("toTotals");
    if (tot) tot.onclick = function () { go(7); };
  }

  function renderTask(i) {
    var id = IDS[i], x = s.tasks[i], o = outcome(x);
    var caps = [t("task:hintNone"), t("task:hintDirection"), t("task:hintLocation"), t("task:hintDemo")];
    var segs = caps.map(function (cap, k) {
      return '<button type="button" data-hint="' + k + '" aria-pressed="' + (x.hint === k) + '">' +
             '<span class="lv">L' + k + '</span><span class="cap">' + cap + '</span></button>';
    }).join("");
    var flag = t("task:" + id + "_flag");

    document.getElementById("panel").innerHTML =
      '<div class="card">' +
        '<p class="eyebrow"><span class="tag">' + id + '</span> ' + t("taskOf", { n: i + 1 }) +
          '<span class="saved" id="savedFlag" data-on="0">' + t("saved") + '</span></p>' +
        '<h2>' + esc(t("task:" + id + "_name")) + '</h2>' +
        '<div class="script"><span class="lab">' + t("readToParticipant") + '</span>' +
          '<p>' + esc(t("script:" + id)) + '</p>' +
          '<div class="alt"><span class="code">' + otherCode() + '</span>' + esc(tOther("script:" + id)) + '</div>' +
        '</div>' +
        '<div class="crit">' +
          '<div><b>' + t("success") + '</b><span>' + esc(t("task:" + id + "_pass")) + '</span></div>' +
          '<div><b>' + t("covers") + '</b><span>' + esc(t("task:" + id + "_covers")) + '</span></div>' +
          (flag ? '<div><b>' + t("watchFor") + '</b><span class="flag">' + esc(flag) + '</span></div>' : '') +
        '</div>' +
        '<div class="field">' +
          '<p class="flabel">' + t("wrongTurns") + ' <span class="hint">' + t("wrongTurnsHint") + '</span></p>' +
          '<div class="tally">' +
            '<button class="knob" type="button" id="w_dn"' + (x.wrong === 0 ? " disabled" : "") + '>&minus;</button>' +
            '<span class="num">' + x.wrong + '</span>' +
            '<button class="knob" type="button" id="w_up">+</button>' +
          '</div>' +
        '</div>' +
        '<div class="field">' +
          '<p class="flabel">' + t("hintLevel") + ' <span class="hint">' + t("hintLevelHint") + '</span></p>' +
          '<div class="seg" id="seg">' + segs + '</div>' +
          '<div class="ladder">L1 <code>' + esc(t("script:L1")) + '</code><br>' +
            'L2 <code>' + esc(t("script:L2")) + '</code> ' + t("ladderNote") + '<br>' +
            t("ladderDemo") + '</div>' +
          '<div style="margin-top:14px"><span class="chip ' + o.k + '">' + o.label + '</span></div>' +
          '<div class="over" id="over" data-on="' + (liveSecs(x) >= LIMIT ? "1" : "0") + '">' + t("timeoutBanner") + '</div>' +
        '</div>' +
        '<div class="field">' +
          '<p class="flabel">' + t("verbatim") + ' <span class="hint">' + t("verbatimHint") + '</span></p>' +
          '<textarea id="q" rows="3" placeholder="' + esc(t("verbatimPlaceholder")) + '">' + esc(x.quote) + '</textarea>' +
        '</div>' +
      '</div>';

    document.getElementById("w_up").onclick = function () { x.wrong++; save(); renderTask(i); };
    document.getElementById("w_dn").onclick = function () { if (x.wrong > 0) x.wrong--; save(); renderTask(i); };
    Array.prototype.forEach.call(document.querySelectorAll("#seg button"), function (b) {
      b.onclick = function () {
        var k = parseInt(b.getAttribute("data-hint"), 10);
        x.hint = (x.hint === k) ? null : k;
        save(); renderTask(i); renderRail();
      };
    });
    bindText("q", function (v) { x.quote = v; save(); });
    paintClock();
  }

  function renderWrap() {
    var fields = DEBRIEF_KEYS.map(function (k) {
      return '<div class="field"><p class="flabel">' + t("task:debrief_" + k) + '</p>' +
             '<textarea id="d_' + k + '" rows="2" placeholder="' + esc(t("debriefPlaceholder")) + '">' + esc(s.debrief[k]) + '</textarea></div>';
    }).join("");

    document.getElementById("panel").innerHTML =
      '<div class="card">' +
        '<p class="eyebrow"><span class="tag">' + t("wrapTag") + '</span> ' + t("wrapEyebrow") +
          '<span class="saved" id="savedFlag" data-on="0">' + t("saved") + '</span></p>' +
        '<h2>' + t("wrapHeading") + '</h2>' +
        '<p class="meta">' + t("wrapNote") + '</p>' + fields +
      '</div>' +
      '<div class="card">' +
        '<p class="eyebrow"><span class="tag">' + t("exportTag") + '</span> ' + t("exportEyebrow") + '</p>' +
        '<textarea class="out" id="out" readonly></textarea>' +
        '<p class="note">' + t("exportNote") + '</p>' +
      '</div>';

    DEBRIEF_KEYS.forEach(function (k) { bindText("d_" + k, function (v) { s.debrief[k] = v; save(); paintOut(); }); });
    paintOut();
  }

  // ---------- aggregation ----------
  function aggregate() {
    var all = store(), names = Object.keys(all).sort();
    var rows = IDS.map(function (id, i) {
      var ind = 0, hint = 0, fail = 0, none = 0, times = [], wrong = 0, quotes = [];
      names.forEach(function (n) {
        var x = all[n].tasks[i], o = outcome(x);
        if (o.key === "independent") ind++;
        else if (o.key === "hint") hint++;
        else if (o.key === "failed") fail++;
        else { none++; return; }
        times.push(liveSecs(x));
        wrong += x.wrong;
        if ((x.quote || "").trim()) quotes.push({ who: n, text: x.quote.trim() });
      });
      return { id: id, ind: ind, hint: hint, fail: fail, none: none,
               med: median(times), wrong: wrong, quotes: quotes };
    });
    return { n: names.length, names: names, rows: rows, all: all };
  }

  function renderTotals() {
    var a = aggregate();
    if (!a.n) {
      document.getElementById("panel").innerHTML =
        '<div class="card"><p class="eyebrow"><span class="tag">' + t("analysisTag") + '</span> ' + t("analysisEyebrow") + '</p>' +
        '<h2>' + t("analysisHeading") + '</h2><p class="meta">' + t("analysisEmpty") + '</p></div>';
      return;
    }

    var body = a.rows.map(function (r) {
      return '<tr><td><span class="id">' + r.id + '</span>' + esc(t("task:" + r.id + "_name")) + '</td>' +
        '<td class="' + (r.ind ? "ok" : "zero") + '">' + r.ind + ' / ' + a.n + '</td>' +
        '<td class="' + (r.hint ? "" : "zero") + '">' + r.hint + ' / ' + a.n + '</td>' +
        '<td class="' + (r.fail ? "bad" : "zero") + '">' + r.fail + ' / ' + a.n + '</td>' +
        '<td>' + (r.med === null ? "—" : r.med + " s") + '</td>' +
        '<td class="' + (r.wrong ? "" : "zero") + '">' + r.wrong + '</td></tr>';
    }).join("");

    var quotes = a.rows.filter(function (r) { return r.quotes.length; }).map(function (r) {
      return '<h3>' + r.id + ' · ' + esc(t("task:" + r.id + "_name")) + '</h3>' +
        r.quotes.map(function (q) {
          return '<p><span class="src">' + esc(q.who) + '</span>' + esc(q.text) + '</p>';
        }).join("");
    }).join("");

    document.getElementById("panel").innerHTML =
      '<div class="card">' +
        '<p class="eyebrow"><span class="tag">' + t("analysisTag") + '</span> ' + t("analysisEyebrow") + ' · n = ' + a.n + '</p>' +
        '<h2>' + t("analysisHeading") + '</h2>' +
        '<div class="tblwrap"><table class="agg"><thead><tr>' +
          '<th>Task</th><th>' + t("outIndependent") + '</th><th>' + t("outWithHint") + '</th>' +
          '<th>Failed</th><th>Median</th><th>' + t("wrongTurns") + '</th>' +
        '</tr></thead><tbody>' + body + '</tbody></table></div>' +
        '<p class="note">' + t("analysisNote") + '</p>' +
      '</div>' +
      (quotes ? '<div class="card"><p class="eyebrow"><span class="tag">' + t("verbatim") + '</span> ' + t("quotesHeading") + '</p><div class="qgroup">' + quotes + '</div></div>' : '') +
      '<div class="card"><p class="eyebrow"><span class="tag">' + t("exportTag") + '</span> Table 7.10</p>' +
        '<textarea class="out" id="aggOut" readonly>' + esc(aggMarkdown(a)) + '</textarea></div>';
  }

  function aggMarkdown(a) {
    var L = [];
    L.push("*Table 7.10 — Guided usability sessions, n = " + a.n + ". Success is coded independently (no hint),");
    L.push("with hint (levels 1 to 2), or failed (demonstrated or five-minute timeout). Times are medians.*");
    L.push("");
    L.push("| Task | Independent | With hint | Failed | Median time | Wrong turns |");
    L.push("|---|:---:|:---:|:---:|---:|---:|");
    a.rows.forEach(function (r) {
      L.push("| " + r.id + " " + tEn("task:" + r.id + "_name") + " | " +
        r.ind + " of " + a.n + " | " + r.hint + " of " + a.n + " | " + r.fail + " of " + a.n + " | " +
        (r.med === null ? "—" : r.med + " s") + " | " + r.wrong + " |");
    });
    L.push("");
    L.push("Sessions: " + a.names.join(", ") + " (reported as P1 to P" + a.n + ")");
    L.push("");
    L.push("**Verbatim, grouped by task**");
    a.rows.forEach(function (r) {
      if (!r.quotes.length) return;
      L.push("");
      L.push("- **" + r.id + " " + tEn("task:" + r.id + "_name") + "**");
      r.quotes.forEach(function (q) { L.push("  - " + q.who + ": " + q.text.replace(/\n/g, " ")); });
    });
    L.push("");
    L.push("**Debrief, grouped by question**");
    DEBRIEF_KEYS.forEach(function (k) {
      L.push("");
      L.push("- **" + tEn("task:debrief_" + k) + "**");
      a.names.forEach(function (n) {
        var v = (a.all[n].debrief[k] || "").replace(/\n/g, " ").trim();
        if (v) L.push("  - " + n + ": " + v);
      });
    });
    return L.join("\n");
  }

  function recordOf(r) {
    var L = [];
    L.push("## " + (r.name || "?") + " · " + r.date);
    L.push("");
    L.push("| Task | Outcome | Time | Wrong turns | Hint | Verbatim |");
    L.push("|---|---|---:|---:|---|---|");
    IDS.forEach(function (id, i) {
      var x = r.tasks[i], o = outcome(x);
      L.push("| " + id + " " + tEn("task:" + id + "_name") + " | " + o.en + " | " + liveSecs(x) + " s | " +
             x.wrong + " | " + (x.hint === null ? "—" : "L" + x.hint) + " | " +
             ((x.quote || "").replace(/\n/g, " ").replace(/\|/g, "/") || "—") + " |");
    });
    L.push("");
    L.push("**Debrief**");
    DEBRIEF_KEYS.forEach(function (k) {
      L.push("- " + tEn("task:debrief_" + k) + "  " + ((r.debrief[k] || "").replace(/\n/g, " ") || "—"));
    });
    L.push("");
    L.push("```json");
    L.push(JSON.stringify({
      name: r.name, date: r.date,
      tasks: IDS.map(function (id, i) {
        var x = r.tasks[i];
        return { id:id, secs:liveSecs(x), wrong:x.wrong, hint:x.hint, outcome:outcome(x).en, quote:x.quote };
      }),
      debrief: r.debrief
    }, null, 1));
    L.push("```");
    return L.join("\n");
  }

  function paintOut() {
    var el = document.getElementById("out");
    if (el) el.value = recordOf(s);
  }

  function renderBar() {
    var bar = document.getElementById("bar");
    bar.innerHTML = "";

    if (step === 0) {
      var start = mkBtn(t("btnStartT1"), "btn wide", function () { go(1); });
      if (!s.name) start.disabled = true;
      bar.appendChild(start);
      stopLoop();
      return;
    }
    if (step === 6) {
      bar.appendChild(mkBtn(t("btnBack"), "btn ghost", function () { go(5); }));
      var cb = mkBtn(t("btnCopySession"), "btn wide", function () { copyFrom("out", cb, t("btnCopied"), t("btnCopySession")); });
      bar.appendChild(cb);
      bar.appendChild(mkBtn(t("btnSeeTotals"), "btn ghost", function () { go(7); }));
      stopLoop();
      return;
    }
    if (step === 7) {
      bar.appendChild(mkBtn(t("btnBack"), "btn ghost", function () { go(0); }));
      var tb = mkBtn(t("btnCopyTable"), "btn wide", function () { copyFrom("aggOut", tb, t("btnCopied"), t("btnCopyTable")); });
      if (!document.getElementById("aggOut")) tb.disabled = true;
      bar.appendChild(tb);
      stopLoop();
      return;
    }

    var x = s.tasks[step-1];
    var clock = document.createElement("span");
    clock.className = "clock"; clock.id = "clock";
    clock.appendChild(document.createTextNode(mmss(liveSecs(x))));
    var u = document.createElement("span"); u.className = "u"; u.textContent = " / 5:00";
    clock.appendChild(u);
    bar.appendChild(clock);

    if (!x.running) {
      bar.appendChild(mkBtn(x.secs === 0 ? t("btnStartTimer") : t("btnResume"), "btn run", function () {
        x.running = true; x.startedAt = Date.now(); save(); renderBar(); startLoop();
      }));
    } else {
      bar.appendChild(mkBtn(t("btnStop"), "btn", function () {
        x.secs = liveSecs(x); x.running = false; save(); renderBar(); paintClock();
      }));
    }
    bar.appendChild(mkBtn(step === 5 ? t("btnWrapUp") : t("btnNext"), "btn ghost", function () {
      if (x.running) { x.secs = liveSecs(x); x.running = false; }
      save(); go(step + 1);
    }));

    paintClock();
    if (x.running) startLoop(); else stopLoop();
  }

  function go(n) {
    var cur = s.tasks[step-1];
    if (cur && cur.running) { cur.secs = liveSecs(cur); cur.running = false; }
    step = Math.max(0, Math.min(7, n));
    save(); render(); window.scrollTo(0, 0);
  }

  window.addEventListener("beforeunload", function () {
    var cur = s.tasks[step-1];
    if (cur && cur.running) { cur.secs = liveSecs(cur); cur.running = false; save(); }
  });

  document.documentElement.setAttribute("lang", i18next.language === "zh" ? "zh-CN" : "en");
  render();
})();
</script>
</body>
</html>
