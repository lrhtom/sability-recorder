<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Analysis · Guided Session Recorder</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📊</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="wrap">
  <div class="mast">
    <h1 id="mTitle"></h1>
    <span class="sub" id="mSub"></span>
    <span class="spacer"></span>
    <button class="lang" type="button" id="lockBtn" style="display:none"></button>
    <button class="lang" type="button" id="langBtn"></button>
  </div>
  <div id="panel"></div>
</div>

<script src="vendor/i18next.min.js"></script>
<script src="locales/en.js"></script>
<script src="locales/zh.js"></script>
<script>
(function () {
  "use strict";

  // SHA-256 of the passphrase. The literal string is deliberately not in this file,
  // because this repository is public. Changing it:
  //   python -c "import hashlib;print(hashlib.sha256(b'NEW').hexdigest())"
  // and paste the result below. See README for why this is a gate and not a lock.
  var PASS_SHA256 = "ac572d7cfde6e1429c979d6aeef6d0be9bde5b7e39db2c61663761be38d9cd7e";

  // Private windows and block-all-cookies settings make sessionStorage throw on
  // access, which would otherwise make the gate impossible to pass at all.
  var memUnlocked = false, storageBlocked = false;
  function isUnlocked() {
    try { return sessionStorage.getItem(UNLOCK_KEY) === "1" || memUnlocked; }
    catch (e) { storageBlocked = true; return memUnlocked; }
  }
  function setUnlocked(v) {
    memUnlocked = v;
    try { if (v) sessionStorage.setItem(UNLOCK_KEY, "1"); else sessionStorage.removeItem(UNLOCK_KEY); }
    catch (e) { storageBlocked = true; }
  }

  var KEY = "usability_recorder_v1";
  var LANG_KEY = "usability_recorder_lang";
  var UNLOCK_KEY = "usability_recorder_admin";
  var CAPS = { T1: 300, T2: 600, T3: 300, T4: 300, T5: 360, T6: 360, T7: 480 };
  var AI_WAIT = { T2: true, T5: true, T6: true, T7: true };
  var IDS = ["T1", "T2", "T3", "T4", "T5", "T6", "T7"];
  function capOf(i) { return CAPS[IDS[i]]; }
  var DEBRIEF_KEYS = ["stuck", "useful", "change"];

  // ---------- i18n ----------
  function initialLang() {
    try {
      var st = localStorage.getItem(LANG_KEY);
      if (st === "en" || st === "zh") return st;
    } catch (e) {}
    return (navigator.language || "en").toLowerCase().indexOf("zh") === 0 ? "zh" : "en";
  }
  i18next.init({
    lng: initialLang(), fallbackLng: "en",
    ns: ["ui", "script", "task", "admin"], defaultNS: "admin",
    resources: { en: window.__RES.en, zh: window.__RES.zh },
    interpolation: { escapeValue: false }
  });
  function t(k, o) { return i18next.t(k, o); }
  // Exports follow the interface language: one language per rendering, never mixed.

  // ---------- helpers ----------
  function esc(x) { return String(x).replace(/[&<>"]/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];}); }
  function read(k) { try { return JSON.parse(localStorage.getItem(k) || "{}"); } catch (e) { return {}; } }
  function median(a) {
    if (!a.length) return null;
    var b = a.slice().sort(function (p, q) { return p - q; }), m = Math.floor(b.length / 2);
    return b.length % 2 ? b[m] : Math.round((b[m-1] + b[m]) / 2);
  }
  function secsOf(x) { return x.running ? x.secs + Math.floor((Date.now() - x.startedAt) / 1000) : (x.secs || 0); }
  function waitOf(x) { return x.waiting ? (x.wait || 0) + Math.floor((Date.now() - x.waitStartedAt) / 1000) : (x.wait || 0); }
  function outcomeOf(x, i) {
    if (secsOf(x) >= capOf(i)) return "failed";
    if (x.correct === false) return "failed";
    if (x.hint === 3) return "failed";
    if (x.hint === 1 || x.hint === 2) return "hint";
    if (x.hint === 0) return "independent";
    return "none";
  }
  // Same coding as outcomeOf, but keeps the two ways of failing apart, which
  // only matters when reading one session rather than aggregating.
  function outcomeDetail(x, i) {
    if (secsOf(x) >= capOf(i)) return { cls:"bad",  label:t("ui:outFailTimeout") };
    if (x.correct === false) return { cls:"bad",  label:t("ui:outFailWrong") };
    if (x.hint === 3)       return { cls:"bad",  label:t("ui:outFailDemo") };
    if (x.hint === 1 || x.hint === 2) return { cls:"warn", label:t("ui:outWithHint") };
    if (x.hint === 0)       return { cls:"ok",   label:t("ui:outIndependent") };
    return { cls:"none", label:t("ui:outNotRecorded") };
  }
  function mmss(s) { var m = Math.floor(s/60), r = s%60; return m + ":" + (r<10?"0":"") + r; }
  function el(id) { return document.getElementById(id); }

  async function sha256(str) {
    if (!window.crypto || !window.crypto.subtle) return null;
    var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
    return Array.prototype.map.call(new Uint8Array(buf), function (b) {
      return ("0" + b.toString(16)).slice(-2);
    }).join("");
  }

  // ---------- data ----------
  // One store. An imported record with a name already held replaces that record
  // outright; nothing is ever merged field by field.
  // Records written before a task was added carry a shorter tasks array, and
  // reading past its end is how this crashed. Everything read from storage or
  // from a paste goes through here first, so the shape always matches IDS.
  function blankTask() {
    return { secs:0, running:false, startedAt:0, wait:0, waiting:false, waitStartedAt:0,
             wrong:0, hint:null, correct:true, quote:"" };
  }
  function normalise(r) {
    if (!r || typeof r !== "object") return null;
    var src = Array.isArray(r.tasks) ? r.tasks : [];
    return {
      name: String(r.name || ""), date: String(r.date || ""),
      tasks: IDS.map(function (id, k) {
        var x = src[k];
        if (!x || typeof x !== "object") return blankTask();
        return { secs: Number(x.secs) || 0, running: false, startedAt: 0,
                 wait: Number(x.wait) || 0, waiting: false, waitStartedAt: 0,
                 wrong: Number(x.wrong) || 0,
                 hint: (x.hint === 0 || x.hint === 1 || x.hint === 2 || x.hint === 3) ? x.hint : null,
                 correct: x.correct !== false,
                 quote: String(x.quote || "") };
      }),
      debrief: {
        stuck:  String(((r.debrief || {}).stuck)  || ""),
        useful: String(((r.debrief || {}).useful) || ""),
        change: String(((r.debrief || {}).change) || "")
      }
    };
  }

  function allRecords() {
    var bag = read(KEY), out = {};
    Object.keys(bag).forEach(function (n) { var r = normalise(bag[n]); if (r) out[n] = r; });
    return out;
  }
  function writeAll(bag) { try { localStorage.setItem(KEY, JSON.stringify(bag)); } catch (e) {} }
  function removeRecord(name) {
    var bag = read(KEY);
    if (!bag[name]) return false;
    delete bag[name];
    writeAll(bag);
    return true;
  }

  // Accepts a full Markdown export, a bare JSON object, or several of either.
  function parsePasted(text) {
    var found = [], seen = {};
    var push = function (o) {
      if (!o || typeof o !== "object") return;
      if (!o.name || !Array.isArray(o.tasks)) return;
      if (seen[o.name]) return;
      seen[o.name] = 1;
      found.push({
        name: String(o.name), date: String(o.date || ""),
        tasks: IDS.map(function (id, k) {
          var s = o.tasks[k] || {};
          var hint = (s.hint === 0 || s.hint === 1 || s.hint === 2 || s.hint === 3) ? s.hint : null;
          var secs = Number(s.secs) || 0;
          // An imported record can state a failure the hint level alone cannot
          // express, so honour it rather than silently recomputing it away.
          var correct = s.correct !== false;
          if (correct && /fail/i.test(String(s.outcome || "")) && hint !== 3 && secs < CAPS[IDS[k]]) correct = false;
          return { secs: secs, running: false, startedAt: 0,
                   wait: Number(s.wait) || 0, waiting: false, waitStartedAt: 0,
                   wrong: Number(s.wrong) || 0, hint: hint, correct: correct,
                   quote: String(s.quote || "") };
        }),
        debrief: {
          stuck: String((o.debrief || {}).stuck || ""),
          useful: String((o.debrief || {}).useful || ""),
          change: String((o.debrief || {}).change || "")
        }
      });
    };

    // fenced json blocks first
    var re = /```json\s*([\s\S]*?)```/g, m;
    while ((m = re.exec(text)) !== null) {
      try { push(JSON.parse(m[1])); } catch (e) {}
    }
    if (found.length) return found;

    // whole thing as JSON, object or array
    try {
      var whole = JSON.parse(text);
      if (Array.isArray(whole)) { whole.forEach(push); }
      else if (whole && whole.tasks) { push(whole); }
      else if (whole && typeof whole === "object") { Object.keys(whole).forEach(function (k) { push(whole[k]); }); }
    } catch (e) {}
    if (found.length) return found;

    // last resort: scan for balanced top-level objects
    var depth = 0, start = -1;
    for (var i = 0; i < text.length; i++) {
      if (text[i] === "{") { if (depth === 0) start = i; depth++; }
      else if (text[i] === "}") {
        depth--;
        if (depth === 0 && start >= 0) {
          try { push(JSON.parse(text.slice(start, i + 1))); } catch (e) {}
          start = -1;
        }
      }
    }
    return found;
  }

  function aggregate() {
    var all = allRecords(), names = Object.keys(all).sort();
    var rows = IDS.map(function (id, i) {
      var ind = 0, hint = 0, fail = 0, none = 0, times = [], waits = [], wrong = 0, quotes = [];
      names.forEach(function (n) {
        var x = all[n].tasks[i], o = outcomeOf(x, i);
        if (o === "independent") ind++;
        else if (o === "hint") hint++;
        else if (o === "failed") fail++;
        else { none++; return; }
        times.push(secsOf(x));
        if (waitOf(x)) waits.push(waitOf(x));
        wrong += x.wrong;
        if ((x.quote || "").trim()) quotes.push({ who: n, text: x.quote.trim() });
      });
      times.sort(function (p, q) { return p - q; });
      return { id: id, ind: ind, hint: hint, fail: fail, none: none, wrong: wrong, quotes: quotes,
               med: median(times), min: times.length ? times[0] : null,
               max: times.length ? times[times.length - 1] : null,
               medWait: waits.length ? median(waits) : null };
    });
    var people = names.map(function (n) {
      var r = all[n], recorded = 0, tt = 0, w = 0;
      r.tasks.forEach(function (x, i) { if (outcomeOf(x, i) !== "none") { recorded++; tt += secsOf(x); w += x.wrong; } });
      return { name: n, date: r.date, recorded: recorded, time: tt, wrong: w };
    });
    return { n: names.length, names: names, rows: rows, people: people, all: all };
  }

  // ---------- render ----------
  function paintChrome() {
    el("mTitle").textContent = t("title");
    el("mSub").textContent = t("sub");
    var lb = el("langBtn");
    lb.textContent = t("ui:langSwitch");
    lb.onclick = function () {
      var next = i18next.language === "en" ? "zh" : "en";
      i18next.changeLanguage(next, function () {
        try { localStorage.setItem(LANG_KEY, next); } catch (e) {}
        document.documentElement.setAttribute("lang", next === "zh" ? "zh-CN" : "en");
        render();
      });
    };
    var kb = el("lockBtn");
    var open = isUnlocked();
    kb.style.display = open ? "" : "none";
    kb.textContent = t("lock");
    kb.onclick = function () { setUnlocked(false); render(); };
  }

  function render() {
    paintChrome();
    if (isUnlocked()) renderBoard();
    else renderGate();
  }

  function renderGate() {
    el("panel").innerHTML =
      '<div class="card gate">' +
        '<p class="lockmark">🔒</p>' +
        '<h2>' + t("gateHeading") + '</h2>' +
        '<p class="meta">' + t("gateNote") + '</p>' +
        '<div class="pwrow">' +
          '<input type="password" id="pw" placeholder="' + esc(t("passPlaceholder")) + '" autocomplete="off" ' +
            'autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="text">' +
          '<button class="peek" type="button" id="peek">' + t("showPass") + '</button>' +
        '</div>' +
        '<button class="btn wide" type="button" id="go" style="width:100%">' + t("unlock") + '</button>' +
        '<p class="err" id="err"></p>' +
      '</div>';

    var attempt = async function () {
      // Phone keyboards add stray spaces, and a paste often brings one along.
      var typed = (el("pw").value || "").trim();
      var h = await sha256(typed);
      if (h === null) { el("err").textContent = t("noCrypto"); return; }
      if (h !== PASS_SHA256) { el("err").textContent = t("wrong"); el("pw").select(); return; }
      setUnlocked(true);
      render();
      if (storageBlocked) {
        var w = el("storageWarn");
        if (w) { w.textContent = t("noStorage"); w.style.display = "block"; }
      }
    };
    el("go").onclick = attempt;
    el("pw").onkeydown = function (e) { if (e.key === "Enter") attempt(); };
    var peek = el("peek");
    peek.onclick = function () {
      var f = el("pw"), hidden = f.type === "password";
      f.type = hidden ? "text" : "password";
      peek.textContent = hidden ? t("hidePass") : t("showPass");
      f.focus();
    };
    el("pw").focus();
  }

  function renderBoard() {
    var a = aggregate();
    var warn = '<p class="note" id="storageWarn" style="display:none;color:var(--warn)"></p>';

    var sources =
      '<div class="card">' +
        '<p class="eyebrow"><span class="tag">' + t("sub") + '</span> ' + t("sourcesHeading") + '</p>' +
        '<div class="srccard" style="max-width:200px"><div class="n">' + Object.keys(read(KEY)).length + '</div>' +
          '<div class="cap">' + t("onThisDevice") + '</div></div>' +
        '<div class="field"><p class="flabel">' + t("pasteHeading") + '</p>' +
          '<p class="meta">' + t("pasteNote") + '</p>' +
          '<textarea class="pastebox" id="paste" placeholder="' + esc(t("pastePlaceholder")) + '"></textarea>' +
          '<div class="rowbtns" id="importRow">' +
            '<button class="btn" type="button" id="doImport">' + t("importBtn") + '</button>' +
          '</div>' +
          '<p class="status" id="mstat"></p>' +
        '</div>' + warn +
      '</div>';

    if (!a.n) {
      el("panel").innerHTML = sources +
        '<div class="card"><p class="meta" style="margin:0">' + t("noData") + '</p></div>';
      wireSources();
      return;
    }

    var perTask = a.rows.map(function (r) {
      return '<tr><td><span class="id">' + r.id + '</span>' + esc(t("task:" + r.id + "_name")) + '</td>' +
        '<td class="' + (r.ind ? "ok" : "zero") + '">' + r.ind + ' / ' + a.n + '</td>' +
        '<td class="' + (r.hint ? "" : "zero") + '">' + r.hint + ' / ' + a.n + '</td>' +
        '<td class="' + (r.fail ? "bad" : "zero") + '">' + r.fail + ' / ' + a.n + '</td>' +
        '<td>' + (r.min === null ? "—" : r.min + " s") + '</td>' +
        '<td>' + (r.med === null ? "—" : r.med + " s") + '</td>' +
        '<td>' + (r.max === null ? "—" : r.max + " s") + '</td>' +
        '<td class="' + (r.medWait === null ? "zero" : "") + '">' + (r.medWait === null ? "—" : r.medWait + " s") + '</td>' +
        '<td class="' + (r.wrong ? "" : "zero") + '">' + r.wrong + '</td></tr>';
    }).join("");

    var bars = a.rows.map(function (r) {
      var w = function (v) { return (v / a.n * 100).toFixed(4) + "%"; };
      return '<div class="barrow"><span class="lbl">' + r.id + '</span><span class="track">' +
        (r.ind ? '<i class="seg-ok" style="width:' + w(r.ind) + '"></i>' : '') +
        (r.hint ? '<i class="seg-hint" style="width:' + w(r.hint) + '"></i>' : '') +
        (r.fail ? '<i class="seg-bad" style="width:' + w(r.fail) + '"></i>' : '') +
        (r.none ? '<i class="seg-none" style="width:' + w(r.none) + '"></i>' : '') +
        '</span><span class="val">' + r.ind + ' / ' + r.hint + ' / ' + r.fail + '</span></div>';
    }).join("");

    var people = a.people.map(function (p, i) {
      var rec = a.all[p.name];
      var detail = IDS.map(function (id, k) {
        var x = rec.tasks[k], o = outcomeDetail(x, k);
        return '<tr><td><span class="tid">' + id + '</span><span class="tnm">' +
            esc(t("task:" + id + "_name")) + '</span></td>' +
          '<td class="oc-' + o.cls + '">' + o.label + '</td>' +
          '<td>' + (x.hint === null && secsOf(x) === 0 ? "—" : mmss(secsOf(x))) + '</td>' +
          '<td>' + (waitOf(x) ? mmss(waitOf(x)) : "—") + '</td>' +
          '<td>' + x.wrong + '</td>' +
          '<td>' + (x.hint === null ? "—" : "L" + x.hint) + '</td>' +
          '<td class="q">' + (esc((x.quote || "").trim()) || "—") + '</td></tr>';
      }).join("");

      return '<tr><td><button class="rowtoggle" type="button" data-row="' + i + '" aria-expanded="false">' +
          '<span class="caret">▶</span>' + esc(p.name) + '</button></td>' +
        '<td class="pid">P' + (i + 1) + '</td>' +
        '<td>' + p.recorded + ' / ' + IDS.length + '</td><td>' + mmss(p.time) + '</td><td>' + p.wrong + '</td>' +
        '<td class="act" id="act' + i + '"><button class="delbtn" type="button" data-del="' + esc(p.name) + '" data-i="' + i + '">' + t("ui:del") + '</button></td></tr>' +
        '<tr class="det" id="det' + i + '" hidden><td colspan="6">' +
          '<table class="detail"><thead><tr>' +
            '<th>' + t("ui:thTask") + '</th><th>' + t("thOutcome") + '</th>' +
            '<th>' + t("thTime") + '</th><th>' + t("ui:thWait") + '</th><th>' + t("thWrong") + '</th>' +
            '<th>' + t("thHint") + '</th><th>' + t("thQuote") + '</th>' +
          '</tr></thead><tbody>' + detail + '</tbody></table>' +
        '</td></tr>';
    }).join("");

    var quotes = a.rows.filter(function (r) { return r.quotes.length; }).map(function (r) {
      return '<h3>' + r.id + ' · ' + esc(t("task:" + r.id + "_name")) + '</h3>' +
        r.quotes.map(function (q) { return '<p><span class="src">' + esc(q.who) + '</span>' + esc(q.text) + '</p>'; }).join("");
    }).join("");

    var debrief = DEBRIEF_KEYS.map(function (k) {
      var items = a.names.map(function (n) {
        var v = (a.all[n].debrief[k] || "").trim();
        return v ? '<p><span class="src">' + esc(n) + '</span>' + esc(v) + '</p>' : "";
      }).join("");
      return items ? '<h3>' + esc(t("task:debrief_" + k)) + '</h3>' + items : "";
    }).join("");

    el("panel").innerHTML = sources +
      '<div class="card">' +
        '<p class="eyebrow"><span class="tag">' + t("perTaskHeading") + '</span> n = ' + a.n + '</p>' +
        '<div class="tblwrap"><table class="agg"><thead><tr><th>' + t("ui:thTask") + '</th>' +
          '<th>' + t("ui:outIndependent") + '</th><th>' + t("ui:outWithHint") + '</th><th>' + t("ui:thFailed") + '</th>' +
          '<th>' + t("thMin") + '</th><th>' + t("thMedian") + '</th><th>' + t("thMax") + '</th>' +
          '<th>' + t("ui:thWait") + '</th><th>' + t("thWrong") + '</th></tr></thead><tbody>' + perTask + '</tbody></table></div>' +
        '<p class="note" style="border:0;padding-top:0;margin-top:8px">' + t("ui:waitHint") + '</p>' +
        '<p class="note">' + t("interpret") + '</p>' +
      '</div>' +

      '<div class="card">' +
        '<p class="eyebrow"><span class="tag">' + t("outcomeHeading") + '</span></p>' +
        '<div class="bars">' + bars + '</div>' +
        '<div class="legend">' +
          '<span><i style="background:var(--ok)"></i>' + t("ui:outIndependent") + '</span>' +
          '<span><i style="background:var(--warn)"></i>' + t("ui:outWithHint") + '</span>' +
          '<span><i style="background:var(--bad)"></i>' + t("ui:thFailed") + '</span>' +
          '<span><i style="background:var(--rule)"></i>' + t("ui:outNotRecorded") + '</span>' +
        '</div>' +
      '</div>' +

      '<div class="card">' +
        '<p class="eyebrow"><span class="tag">' + t("peopleHeading") + '</span></p>' +
        '<p class="meta" style="margin:0 0 12px">' + t("detailHint") + '</p>' +
        '<div class="expandbar"><button type="button" id="expAll">' + t("expandAll") + '</button></div>' +
        '<div class="tblwrap"><table class="people"><thead><tr><th>' + t("ui:thName") + '</th><th>' + t("ui:thId") + '</th>' +
          '<th>' + t("thTasks") + '</th><th>' + t("thTime") + '</th><th>' + t("thWrong") + '</th><th></th>' +
        '</tr></thead><tbody>' + people + '</tbody></table></div>' +
        '<p class="note">' + t("deleteNote") + '</p>' +
        '<div class="danger" id="dangerZone">' +
          '<span class="warn">' + t("exportFirst") + '</span>' +
          '<button class="wipebtn" type="button" id="wipe">' + t("deleteAll") + '</button>' +
        '</div>' +
      '</div>' +

      (quotes ? '<div class="card"><p class="eyebrow"><span class="tag">' + t("quotesHeading") + '</span></p><div class="qgroup">' + quotes + '</div></div>' : '') +
      (debrief ? '<div class="card"><p class="eyebrow"><span class="tag">' + t("debriefHeading") + '</span></p><div class="dbgroup">' + debrief + '</div></div>' : '') +

      '<div class="card">' +
        '<p class="eyebrow"><span class="tag">' + t("exportHeading") + '</span> ' + t("exportTable") + '</p>' +
        '<textarea class="out" id="mdOut" readonly>' + esc(markdown(a)) + '</textarea>' +
        '<div class="rowbtns">' +
          '<button class="btn" type="button" id="cpMd">' + t("copyTable") + '</button>' +
          '<button class="btn ghost" type="button" id="dlPng">' + t("dlPng") + '</button>' +
          '<button class="btn ghost" type="button" id="dlRaw">' + t("dlPngRaw") + '</button>' +
        '</div>' +
        '<div class="field"><p class="flabel">' + t("exportJson") + '</p>' +
          '<textarea class="out" id="jsOut" readonly style="min-height:150px">' + esc(JSON.stringify(a.all, null, 1)) + '</textarea>' +
          '<div class="rowbtns">' +

  function wireRows() {
    var toggles = Array.prototype.slice.call(document.querySelectorAll(".rowtoggle"));
    var setOne = function (b, open) {
      b.setAttribute("aria-expanded", String(open));
      var row = el("det" + b.getAttribute("data-row"));
      if (row) row.hidden = !open;
    };
    toggles.forEach(function (b) {
      b.onclick = function () { setOne(b, b.getAttribute("aria-expanded") !== "true"); syncAll(); };
    });
    Array.prototype.forEach.call(document.querySelectorAll(".delbtn"), function (b) {
      b.onclick = function () {
        var name = b.getAttribute("data-del"), cell = el("act" + b.getAttribute("data-i"));
        cell.innerHTML = '<span class="confirm"><span class="q">' +
          esc(t("confirmDel", { name: name })) + '</span>' +
          '<button class="yes" type="button">' + t("confirmYes") + '</button>' +
          '<button class="no" type="button">' + t("cancel") + '</button></span>';
        cell.querySelector(".yes").onclick = function () { removeRecord(name); render(); };
        cell.querySelector(".no").onclick = function () { render(); };
      };
    });

    // The wipe lives behind the passphrase gate and away from the row deletes,
    // because its blast radius is every session on the device.
    var wipe = el("wipe");
    if (wipe) wipe.onclick = function () {
      var zone = el("dangerZone");
      zone.innerHTML = '<span class="wipeconfirm">' +
        '<span class="q">' + esc(t("confirmAll", { count: aggregate().n })) + '</span>' +
        '<button class="yes" type="button">' + t("confirmAllYes") + '</button>' +
        '<button class="no" type="button">' + t("cancel") + '</button></span>';
      zone.querySelector(".yes").onclick = function () {
        try { localStorage.removeItem(KEY); } catch (e) {}
        render();
      };
      zone.querySelector(".no").onclick = function () { render(); };
    };

    var all = el("expAll");
    var syncAll = function () {
      if (!all) return;
      var anyClosed = toggles.some(function (b) { return b.getAttribute("aria-expanded") !== "true"; });
      all.textContent = anyClosed ? t("expandAll") : t("collapseAll");
    };
    if (all) all.onclick = function () {
      var open = toggles.some(function (b) { return b.getAttribute("aria-expanded") !== "true"; });
      toggles.forEach(function (b) { setOne(b, open); });
      syncAll();
    };

  function wireCopy(btnId, taId, back) {

  function wireSources() {
    var b = el("doImport");

      var found = parsePasted(el("paste").value || ""), st = el("mstat");
      if (!found.length) { st.className = "status bad"; st.textContent = t("importedNone"); return; }

  // ---------- downloads ----------
  function stamp() {
    var d = new Date(), p = function (n) { return (n < 10 ? "0" : "") + n; };
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes());
  }
  function grab(url, kind, ext) {
    var a2 = document.createElement("a");
    a2.href = url; a2.download = "usability-" + kind + "-" + stamp() + "." + ext;
    document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }
  function save(data, mime, kind, ext) {
    grab(URL.createObjectURL(new Blob([data], { type: mime })), kind, ext);
  }
  function shoot(c, kind) {
    c.toBlob(function (b) { grab(URL.createObjectURL(b), kind, "png"); }, "image/png");
  }

  // One palette for both figures, so the two land in the document looking related.
  var FIG = {
    INK: "#14181A", INK2: "#4A5350", INK3: "#7C8582", RULE: "#CDD2CB", SUNK: "#E9EBE7",
    OK: "#1E6B45", WARN: "#8A6212", BAD: "#8E2A1E",
    OKBG: "#E3EFE7", WARNBG: "#F5EDD9", BADBG: "#F5E2DE", NONEBG: "#F0F2EE",
    UI: ' "Helvetica Neue", Arial, "Microsoft YaHei", "PingFang SC", sans-serif',
    NUM: ' Consolas, Menlo, monospace'
  };

  // A break can land between two CJK characters or at a space, which one regex
  // cannot do without a lookbehind that older mobile Safari refuses to parse.
  function pieces(s) {
    var out = [], buf = "";
    for (var i = 0; i < s.length; i++) {
      var ch = s.charAt(i), cc = s.charCodeAt(i);
      var cjk = (cc >= 0x2E80 && cc <= 0x9FFF) || (cc >= 0xFF00 && cc <= 0xFF60);
      if (ch === " ") { if (buf) { out.push(buf); buf = ""; } out.push(" "); }
      else if (cjk) { if (buf) { out.push(buf); buf = ""; } out.push(ch); }
      else buf += ch;
    }
    if (buf) out.push(buf);
    return out;
  }
  function wrapLines(g, s, maxw) {
    var lines = [], line = "";
    pieces(String(s)).forEach(function (p) {
      if (!line && p === " ") return;
      var test = line + p;
      if (line && g.measureText(test).width > maxw) { lines.push(line); line = (p === " " ? "" : p); }
      else line = test;
    });
    if (line) lines.push(line);
    return lines.length ? lines : [""];
  }
  function clip(g, s, maxw) {
    var out = String(s);
    while (g.measureText(out).width > maxw && out.length > 2) out = out.slice(0, -2);
    return out;
  }

  // Drawn rather than screenshotted, and always on a light ground, because the
  // figure ends up in a document rather than on the viewer's screen.
  function downloadPng(a) {
    var S = 3, W = 900, rowH = 44, headH = 116, footH = 84;
    var H = headH + IDS.length * rowH + footH;
    var c = document.createElement("canvas");
    c.width = W * S; c.height = H * S;
    var g = c.getContext("2d");
    g.scale(S, S);

    var INK = FIG.INK, INK2 = FIG.INK2, INK3 = FIG.INK3, RULE = FIG.RULE,
        OK = FIG.OK, WARN = FIG.WARN, BAD = FIG.BAD, SUNK = FIG.SUNK;
    var UI = FIG.UI, NUM = FIG.NUM;

    g.fillStyle = "#FFFFFF"; g.fillRect(0, 0, W, H);

    var M = 40, barX = 340, barW = 190, colMed = 690, colWait = 780, right = W - M;

    g.fillStyle = INK; g.font = "700 21px" + UI;
    g.fillText(t("pngTitle"), M, 46);
    g.fillStyle = INK3; g.font = "13px" + NUM;
    g.fillText("n = " + a.n + "   ·   " + new Date().toISOString().slice(0, 10), M, 68);

    g.strokeStyle = RULE; g.lineWidth = 1;
    g.beginPath(); g.moveTo(M, 84); g.lineTo(right, 84); g.stroke();

    g.fillStyle = INK3; g.font = "11px" + NUM;
    g.fillText(t("ui:thTask").toUpperCase(), M, 106);
    g.fillText(t("pngCols").toUpperCase(), barX, 106);
    g.textAlign = "right";
    g.fillText(t("thMedian").toUpperCase(), colMed, 106);
    g.fillText(t("ui:thWait").toUpperCase(), colWait, 106);
    g.fillText(t("thWrong").toUpperCase(), right, 106);
    g.textAlign = "left";

    a.rows.forEach(function (r, i) {
      var y = headH + i * rowH, mid = y + rowH / 2;

      g.strokeStyle = RULE; g.beginPath();
      g.moveTo(M, y + rowH - 1); g.lineTo(right, y + rowH - 1); g.stroke();

      g.fillStyle = INK; g.font = "700 14px" + NUM;
      g.fillText(r.id, M, mid + 5);
      g.fillStyle = INK2; g.font = "14px" + UI;
      var nm = t("task:" + r.id + "_name");
      while (g.measureText(nm).width > barX - M - 46 && nm.length > 4) nm = nm.slice(0, -2);
      g.fillText(nm, M + 34, mid + 5);

      var bx = barX, bh = 16, by = mid - bh / 2;
      g.fillStyle = SUNK; g.fillRect(bx, by, barW, bh);
      var seg = [[r.ind, OK], [r.hint, WARN], [r.fail, BAD]];
      seg.forEach(function (s2) {
        if (!s2[0]) return;
        var w = barW * s2[0] / a.n;
        g.fillStyle = s2[1]; g.fillRect(bx, by, w, bh); bx += w;
      });

      g.font = "13px" + NUM; g.textAlign = "left";
      g.fillStyle = r.ind ? OK : INK3;  g.fillText(String(r.ind), barX + barW + 12, mid + 5);
      g.fillStyle = INK3;               g.fillText("/", barX + barW + 30, mid + 5);
      g.fillStyle = r.hint ? WARN : INK3; g.fillText(String(r.hint), barX + barW + 40, mid + 5);
      g.fillStyle = INK3;               g.fillText("/", barX + barW + 58, mid + 5);
      g.fillStyle = r.fail ? BAD : INK3;  g.fillText(String(r.fail), barX + barW + 68, mid + 5);

      g.textAlign = "right"; g.fillStyle = INK2;
      g.fillText(r.med === null ? "—" : r.med + " s", colMed, mid + 5);
      g.fillStyle = r.medWait === null ? INK3 : INK2;
      g.fillText(r.medWait === null ? "—" : r.medWait + " s", colWait, mid + 5);
      g.fillStyle = r.wrong ? INK2 : INK3;
      g.fillText(String(r.wrong), right, mid + 5);
      g.textAlign = "left";
    });

    var fy = headH + IDS.length * rowH + 26;
    [[OK, t("ui:outIndependent")], [WARN, t("ui:outWithHint")], [BAD, t("ui:thFailed")]].forEach(function (l, i) {
      var x = M + i * 150;
      g.fillStyle = l[0]; g.fillRect(x, fy - 9, 10, 10);
      g.fillStyle = INK2; g.font = "12px" + UI; g.fillText(l[1], x + 16, fy);
    });
    g.fillStyle = INK3; g.font = "12px" + UI;
    var ly = fy + 26;
    wrapLines(g, t("pngNote"), right - M).forEach(function (l) { g.fillText(l, M, ly); ly += 17; });

    shoot(c, "summary");
  }

  // The companion to the summary: every observation as recorded, plus what each
  // person said. The summary is the claim; this is the material behind it, which
  // is what an appendix has to carry for the claim to be checkable.
  function downloadRawPng(a) {
    var S = 3, M = 40, LBL = 300, ROW = 62;
    var CELL = Math.max(84, Math.min(150, Math.floor(630 / Math.max(a.n, 1))));
    var W = Math.max(760, 2 * M + LBL + a.n * CELL);
    var gridX = M + LBL, right = W - M;
    var qx = M + 40, qw = right - qx;

    var TINT = { ok: [FIG.OK, FIG.OKBG], warn: [FIG.WARN, FIG.WARNBG],
                 bad: [FIG.BAD, FIG.BADBG], none: [FIG.INK3, FIG.NONEBG] };

    // How a cell ended, in the few characters a cell can hold.
    function shortOutcome(x, k) {
      if (secsOf(x) >= capOf(k)) return t("rawFailCap");
      if (x.correct === false) return t("rawFailAns");
      if (x.hint === 3) return t("rawFailDemo");
      if (x.hint === 1 || x.hint === 2) return t("rawHintN", { n: x.hint });
      if (x.hint === 0) return t("rawOk");
      return t("rawNone");
    }

    // Measured and painted by the same walk, so the canvas is never the wrong
    // height for what goes on it.
    function paint(g, D) {
      var F = function (s, x, y) { if (D) g.fillText(s, x, y); };
      var R = function (x, y, w, h) { if (D) g.fillRect(x, y, w, h); };
      var L = function (x1, y1, x2, y2) {
        if (!D) return;
        g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
      };

      if (D) { g.fillStyle = FIG.INK; }
      g.font = "700 21px" + FIG.UI;
      F(t("rawTitle"), M, 46);
      if (D) g.fillStyle = FIG.INK3;
      g.font = "13px" + FIG.NUM;
      F("n = " + a.n + "   ·   " + new Date().toISOString().slice(0, 10), M, 68);

      if (D) { g.strokeStyle = FIG.RULE; g.lineWidth = 1; }
      L(M, 84, right, 84);

      g.font = "11px" + FIG.NUM;
      if (D) g.fillStyle = FIG.INK3;
      F(t("ui:thTask").toUpperCase(), M, 106);
      if (D) g.textAlign = "center";
      a.people.forEach(function (p, j) { F("P" + (j + 1), gridX + j * CELL + CELL / 2, 106); });
      if (D) g.textAlign = "left";

      var top = 116;
      a.rows.forEach(function (r, k) {
        var y = top + k * ROW;
        if (D) g.strokeStyle = FIG.RULE;
        L(M, y + ROW - 1, right, y + ROW - 1);

        if (D) g.fillStyle = FIG.INK;
        g.font = "700 13px" + FIG.NUM;
        F(r.id, M, y + 26);
        if (D) g.fillStyle = FIG.INK2;
        g.font = "13px" + FIG.UI;
        F(clip(g, t("task:" + r.id + "_name"), LBL - 48), M + 34, y + 26);
        if (D) g.fillStyle = FIG.INK3;
        g.font = "11px" + FIG.NUM;
        F("≤ " + mmss(capOf(k)), M + 34, y + 44);

        a.names.forEach(function (nm, j) {
          var x = gridX + j * CELL, cx = x + CELL / 2;
          var task = a.all[nm].tasks[k], o = outcomeDetail(task, k), tint = TINT[o.cls];

          if (D) g.fillStyle = tint[1];
          R(x + 3, y + 5, CELL - 6, ROW - 12);

          if (D) g.textAlign = "center";
          if (D) g.fillStyle = tint[0];
          g.font = "700 15px" + FIG.NUM;
          F(task.hint === null && secsOf(task) === 0 ? "—" : mmss(secsOf(task)), cx, y + 26);

          g.font = "10px" + FIG.UI;
          F(clip(g, shortOutcome(task, k), CELL - 14), cx, y + 41);

          var tags = [];
          if (task.wrong) tags.push("×" + task.wrong);
          if (waitOf(task)) tags.push(t("rawWaitTag", { s: waitOf(task) }));
          if (D) g.fillStyle = FIG.INK3;
          g.font = "10px" + FIG.NUM;
          F(clip(g, tags.join("  "), CELL - 14), cx, y + 54);
          if (D) g.textAlign = "left";
        });
      });

      var y2 = top + a.rows.length * ROW + 22;
      if (D) g.fillStyle = FIG.INK3;
      g.font = "11px" + FIG.NUM;
      F(t("rawTotal").toUpperCase(), M, y2);
      if (D) { g.textAlign = "center"; g.fillStyle = FIG.INK2; }
      g.font = "12px" + FIG.NUM;
      a.people.forEach(function (p, j) { F(mmss(p.time), gridX + j * CELL + CELL / 2, y2); });
      if (D) g.textAlign = "left";

      y2 += 30;
      [[FIG.OKBG, FIG.OK, t("ui:outIndependent")], [FIG.WARNBG, FIG.WARN, t("ui:outWithHint")],
       [FIG.BADBG, FIG.BAD, t("ui:thFailed")], [FIG.NONEBG, FIG.INK3, t("ui:outNotRecorded")]]
        .forEach(function (l, i) {
          var x = M + i * 150;
          // A sample of the cell rather than a block of ink, because the cells
          // themselves are tinted.
          if (D) {
            g.fillStyle = l[0]; g.fillRect(x, y2 - 10, 13, 13);
            g.strokeStyle = l[1]; g.lineWidth = 2; g.strokeRect(x + 1, y2 - 9, 11, 11);
            g.lineWidth = 1; g.fillStyle = FIG.INK2;
          }
          g.font = "12px" + FIG.UI;
          F(l[2], x + 19, y2);
        });

      y2 += 24;
      if (D) g.fillStyle = FIG.INK3;
      g.font = "12px" + FIG.UI;
      wrapLines(g, t("rawCellNote"), right - M).forEach(function (l) { F(l, M, y2); y2 += 17; });

      // What people said, kept next to the numbers rather than in a separate file.
      var withQuotes = a.rows.filter(function (r) { return r.quotes.length; });
      if (withQuotes.length) {
        y2 += 20;
        if (D) g.strokeStyle = FIG.RULE;
        L(M, y2 - 14, right, y2 - 14);
        if (D) g.fillStyle = FIG.INK;
        g.font = "700 15px" + FIG.UI;
        F(t("rawQuotes"), M, y2 + 6);
        y2 += 30;

        withQuotes.forEach(function (r) {
          if (D) g.fillStyle = FIG.INK2;
          g.font = "700 13px" + FIG.NUM;
          F(r.id, M, y2);
          g.font = "700 13px" + FIG.UI;
          F(clip(g, t("task:" + r.id + "_name"), right - M - 40), M + 34, y2);
          y2 += 20;
          r.quotes.forEach(function (q) {
            var pi = a.names.indexOf(q.who) + 1;
            if (D) g.fillStyle = FIG.INK3;
            g.font = "12px" + FIG.NUM;
            F("P" + pi, M + 6, y2);
            if (D) g.fillStyle = FIG.INK;
            g.font = "13px" + FIG.UI;
            wrapLines(g, q.text.replace(/\s+/g, " "), qw).forEach(function (l) { F(l, qx, y2); y2 += 18; });
            y2 += 4;
          });
          y2 += 10;
        });
      }

      var said = DEBRIEF_KEYS.filter(function (k) {
        return a.names.some(function (n) { return (a.all[n].debrief[k] || "").trim(); });
      });
      if (said.length) {
        y2 += 10;
        if (D) g.strokeStyle = FIG.RULE;
        L(M, y2 - 14, right, y2 - 14);
        if (D) g.fillStyle = FIG.INK;
        g.font = "700 15px" + FIG.UI;
        F(t("rawDebrief"), M, y2 + 6);
        y2 += 30;

        said.forEach(function (k) {
          if (D) g.fillStyle = FIG.INK2;
          g.font = "700 13px" + FIG.UI;
          wrapLines(g, t("task:debrief_" + k), right - M).forEach(function (l) { F(l, M, y2); y2 += 18; });
          y2 += 4;
          a.names.forEach(function (n, i) {
            var v = (a.all[n].debrief[k] || "").replace(/\s+/g, " ").trim();
            if (!v) return;
            if (D) g.fillStyle = FIG.INK3;
            g.font = "12px" + FIG.NUM;
            F("P" + (i + 1), M + 6, y2);
            if (D) g.fillStyle = FIG.INK;
            g.font = "13px" + FIG.UI;
            wrapLines(g, v, qw).forEach(function (l) { F(l, qx, y2); y2 += 18; });
            y2 += 4;
          });
          y2 += 10;
        });
      }

      y2 += 14;
      if (D) g.strokeStyle = FIG.RULE;
      L(M, y2 - 14, right, y2 - 14);
      if (D) g.fillStyle = FIG.INK3;
      g.font = "11px" + FIG.UI;
      wrapLines(g, t("rawNoteFoot"), right - M).forEach(function (l) { F(l, M, y2); y2 += 15; });

      return y2 + 14;
    }

    var H = paint(document.createElement("canvas").getContext("2d"), false);
    var c = document.createElement("canvas");
    c.width = W * S; c.height = H * S;
    var g = c.getContext("2d");
    g.scale(S, S);
    g.fillStyle = "#FFFFFF"; g.fillRect(0, 0, W, H);
    g.textBaseline = "alphabetic";
    paint(g, true);

    shoot(c, "observations");
  }

  function markdown(a) {
    var L = [];
    L.push(t("ui:expCap1", { n: a.n }));
    L.push(t("ui:expCap2"));
    L.push("");
    L.push(t("ui:expHead"));
    L.push("|---|:---:|:---:|:---:|---:|---:|---:|");
    a.rows.forEach(function (r) {
      L.push("| " + r.id + " " + t("task:" + r.id + "_name") + " | " +
        r.ind + " of " + a.n + " | " + r.hint + " of " + a.n + " | " + r.fail + " of " + a.n + " | " +
        (r.med === null ? "—" : r.med + " s") + " | " +
        (r.medWait === null ? "—" : r.medWait + " s") + " | " + r.wrong + " |");
    });
    L.push("");
    L.push(t("ui:expCapNote", { caps: IDS.map(function (id, k) { return id + " " + mmss(capOf(k)); }).join(", ") }));
    L.push("");
    L.push(t("ui:expRange"));
    a.rows.forEach(function (r) {
      if (r.min === null) return;
      L.push("- " + r.id + ": " + r.min + " s to " + r.max + " s");
    });
    L.push("");
    L.push(t("ui:expParticipants") + " " +
      a.people.map(function (p, i) { return "P" + (i + 1) + " = " + p.name; }).join(", "));
    L.push("");
    L.push(t("ui:expVerbatimH"));
    a.rows.forEach(function (r) {
      if (!r.quotes.length) return;
      L.push("");
      L.push("- **" + r.id + " " + t("task:" + r.id + "_name") + "**");
      r.quotes.forEach(function (q) {
        var i = a.names.indexOf(q.who);
        L.push("  - P" + (i + 1) + ": " + q.text.replace(/\n/g, " "));
      });
    });
    L.push("");
    L.push(t("ui:expDebriefH"));
    DEBRIEF_KEYS.forEach(function (k) {
      L.push("");
      L.push("- **" + t("task:debrief_" + k) + "**");
      a.names.forEach(function (n, i) {
        var v = (a.all[n].debrief[k] || "").replace(/\n/g, " ").trim();
        if (v) L.push("  - P" + (i + 1) + ": " + v);
      });
    });
    return L.join("\n");
  }

  document.documentElement.setAttribute("lang", i18next.language === "zh" ? "zh-CN" : "en");
  render();
})();
</script>
